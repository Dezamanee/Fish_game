function drawFisherman(){
  const cl = eqItem('cloth');
  const breath = Math.sin(g.time * 1.6) * 1.4;
  const lean = g.lean;
  const hipX = 200, hipY = 300;
  const rot = (x, y) => {
    const dx = x - hipX, dy = y - hipY;
    const c = Math.cos(lean), s = Math.sin(lean);
    return { x: hipX + dx * c - dy * s, y: hipY + dx * s + dy * c };
  };

  const hand = g.hand;
  const tip = g.rodTip;
  const behind = g.rodAngle < -1.25;

  const drawTrail = () => {
    if (g.mode === 'cast' && g.castPhase === 'swing') {
      ctx.strokeStyle = 'rgba(255,255,255,.16)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(hand.x, hand.y, 154, g.swingFrom, g.rodAngle);
      ctx.stroke();
    }
  };
  const drawRod = () => {
    ctx.strokeStyle = '#5a3b23';
    ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.moveTo(hand.x, hand.y); ctx.lineTo(tip.x, tip.y); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.20)';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(hand.x, hand.y - 1.5); ctx.lineTo(tip.x, tip.y - 1.5); ctx.stroke();
    const rx = lerp(hand.x, tip.x, 0.17), ry = lerp(hand.y, tip.y, 0.17);
    ctx.fillStyle = '#c6d2d9';
    ctx.beginPath(); ctx.arc(rx, ry + 6, 5, 0, PI2); ctx.fill();
    ctx.fillStyle = '#8d9aa3';
    ctx.beginPath(); ctx.arc(rx, ry + 6, 2, 0, PI2); ctx.fill();
  };

  if (behind) { drawTrail(); drawRod(); }

  ctx.strokeStyle = cl.pants;
  ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(200, 290); ctx.lineTo(232, 306); ctx.lineTo(238, 328); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(207, 292); ctx.lineTo(239, 315); ctx.lineTo(245, 334); ctx.stroke();
  ctx.fillStyle = cl.boots;
  ctx.beginPath(); ctx.ellipse(240, 331, 8, 4.5, 0.45, 0, PI2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(247, 337, 8, 4.5, 0.45, 0, PI2); ctx.fill();

  ctx.save();
  ctx.translate(hipX, hipY);
  ctx.rotate(lean);
  ctx.translate(-hipX, -hipY);

  ctx.fillStyle = cl.shirt;
  roundRect(186, 250 + breath, 37, 46, 13); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  roundRect(186, 264 + breath, 37, 6, 3); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.14)';
  roundRect(216, 252 + breath, 8, 42, 4); ctx.fill();

  ctx.fillStyle = '#e8b98f';
  ctx.beginPath(); ctx.arc(206, 240 + breath, 13, 0, PI2); ctx.fill();

  ctx.fillStyle = cl.hat;
  if (cl.hatStyle === 'cap') {
    ctx.beginPath(); ctx.ellipse(206, 228 + breath, 16, 12, 0, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.ellipse(222, 228 + breath, 12, 4, 0.1, 0, PI2); ctx.fill();
  } else if (cl.hatStyle === 'beanie') {
    ctx.beginPath(); ctx.ellipse(206, 229 + breath, 16, 13, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    roundRect(190, 226 + breath, 32, 6, 3); ctx.fill();
  } else if (cl.hatStyle === 'wide') {
    ctx.beginPath(); ctx.ellipse(206, 231 + breath, 32, 7.5, 0, 0, PI2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(206, 226 + breath, 16, 10, 0, Math.PI, 0); ctx.fill();
  } else {
    ctx.beginPath(); ctx.ellipse(206, 231 + breath, 25, 7.5, 0, 0, PI2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(206, 224 + breath, 15, 11, 0, Math.PI, 0); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,.16)';
  ctx.beginPath(); ctx.ellipse(201, 220 + breath, 7, 4, 0, 0, PI2); ctx.fill();
  ctx.fillStyle = '#2a3a26';
  ctx.beginPath(); ctx.arc(213, 241 + breath, 1.9, 0, PI2); ctx.fill();
  ctx.strokeStyle = 'rgba(150,90,60,.7)';
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(210, 246 + breath); ctx.lineTo(216, 246 + breath); ctx.stroke();

  ctx.restore();

  const sh = rot(214, 258 + breath);
  ctx.strokeStyle = cl.shirt;
  ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(hand.x, hand.y); ctx.stroke();
  ctx.fillStyle = '#e8b98f';
  ctx.beginPath(); ctx.arc(hand.x, hand.y, 5, 0, PI2); ctx.fill();

  if (!behind) { drawTrail(); drawRod(); }
}

function drawLineAndBobber(){
  if (!g.bob.visible) return;
  const tip = g.rodTip;
  const b = g.bob;
  const midX = (tip.x + b.x) / 2;
  const midY = (tip.y + b.y) / 2 + (g.mode === 'waiting' ? 16 : 6);

  ctx.strokeStyle = 'rgba(240,250,255,.55)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(tip.x, tip.y);
  ctx.quadraticCurveTo(midX, midY, b.x, b.y - 7);
  ctx.stroke();

  let by = b.y;
  if (g.mode === 'waiting') by += Math.sin(g.time * 2.6) * 1.6;
  if (g.mode === 'bite') by += Math.abs(Math.sin(g.time * 22)) * 5;

  ctx.fillStyle = g.recall ? 'rgba(0,0,0,0)' : 'rgba(0,0,0,.20)';
  ctx.beginPath(); ctx.ellipse(b.x, by + 8, 8, 3, 0, 0, PI2); ctx.fill();

  if (g.recall) {
    const rp = clamp(g.recall.t / g.recall.dur, 0, 1);
    ctx.strokeStyle = 'rgba(240,250,255,' + (0.5 * (1 - rp)).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b.x + 16, b.y + 12);
    ctx.lineTo(b.x, b.y - 7);
    ctx.stroke();
  }

  ctx.fillStyle = '#f4f7f9';
  ctx.beginPath(); ctx.arc(b.x, by, 7, 0, PI2); ctx.fill();
  ctx.fillStyle = '#e04b4b';
  ctx.beginPath(); ctx.arc(b.x, by, 7, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = 'rgba(10,30,40,.35)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(b.x, by, 7, 0, PI2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.beginPath(); ctx.arc(b.x - 2.4, by - 2.6, 1.9, 0, PI2); ctx.fill();

  ctx.strokeStyle = '#e04b4b';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(b.x, by - 7); ctx.lineTo(b.x, by - 15); ctx.stroke();
  ctx.fillStyle = '#ffd85e';
  ctx.beginPath(); ctx.arc(b.x, by - 15, 2, 0, PI2); ctx.fill();
}

function drawFx(){
  for (const p of g.parts) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = 'rgba(226,246,255,' + (0.85 * a).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, PI2); ctx.fill();
  }
  ctx.textAlign = 'center';
  for (const f of g.floats) {
    const a = clamp(f.life / 1.4, 0, 1);
    ctx.font = '700 20px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,' + (0.35 * a).toFixed(3) + ')';
    ctx.fillText(f.text, f.x + 1, f.y + 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = f.col;
    ctx.fillText(f.text, f.x, f.y);
    ctx.globalAlpha = 1;
  }
}

function drawHUD(){
  if (g.scene === 'shop') { drawShopHUD(); return; }
  if (g.scene === 'store') { drawStoreHUD(); return; }
  ctx.textAlign = 'left';
  ctx.font = '600 13px "Segoe UI",system-ui,sans-serif';

  roundRect(16, 14, 252, 122, 14);
  ctx.fillStyle = 'rgba(4,16,26,.58)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(240,201,135,.22)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.fillStyle = '#ffe9b0';
  ctx.font = '700 22px "Segoe UI",system-ui,sans-serif';
  ctx.fillText(money(P.money) + ' ₽', 30, 42);
  ctx.fillStyle = 'rgba(210,232,244,.55)';
  ctx.font = '600 11px "Segoe UI",system-ui,sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('Поймано: ' + P.caught, 246, 30);
  ctx.textAlign = 'left';

  const barX = 92, barW = 158;

  ctx.fillStyle = '#ffd98a';
  ctx.font = '700 13px "Segoe UI",system-ui,sans-serif';
  ctx.fillText('УР. ' + P.lvl, 30, 68);
  roundRect(barX, 57, barW, 9, 4.5);
  ctx.fillStyle = 'rgba(255,255,255,.13)';
  ctx.fill();
  const xr = clamp(g.xpView, 0.02, 1);
  roundRect(barX, 57, Math.max(3, barW * xr), 9, 4.5);
  ctx.fillStyle = '#f0c987';
  ctx.fill();
  ctx.fillStyle = 'rgba(220,238,248,.55)';
  ctx.font = '600 10px "Segoe UI",system-ui,sans-serif';
  ctx.fillText(P.xp + ' / ' + xpNeed(P.lvl) + ' XP', barX, 78);

  ctx.fillStyle = '#9fe3a8';
  ctx.font = '700 13px "Segoe UI",system-ui,sans-serif';
  ctx.fillText('СИЛЫ', 30, 96);
  roundRect(barX, 85, barW, 11, 5.5);
  ctx.fillStyle = 'rgba(255,255,255,.13)';
  ctx.fill();
  const hr = clamp(g.hpView, 0.02, 1);
  roundRect(barX, 85, Math.max(3, barW * hr), 11, 5.5);
  ctx.fillStyle = hr > 0.5 ? '#63c98a' : hr > 0.25 ? '#e2b45a' : '#e0674b';
  ctx.fill();
  ctx.fillStyle = 'rgba(235,245,250,.9)';
  ctx.font = '600 10px "Segoe UI",system-ui,sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(Math.round(P.hp) + ' / ' + hpMax(), barX + barW - 5, 94);
  ctx.textAlign = 'left';

  ctx.fillStyle = 'rgba(255,233,176,.88)';
  ctx.font = '600 12px "Segoe UI",system-ui,sans-serif';
  ctx.fillText(clockText(g.tod) + ' · ' + todPhase(g.tod) + ' · ' + (LOCS.find(l => l.id === g.loc) || LOCS[0]).name, 30, 116);
  if (g.event) {
    const evLabel = g.event.name + ' · ' + Math.ceil(g.event.t) + ' с';
    ctx.font = '700 13px "Segoe UI",system-ui,sans-serif';
    const evW = ctx.measureText(evLabel).width + 28;
    roundRect(W / 2 - evW / 2, 58, evW, 30, 15);
    ctx.fillStyle = 'rgba(6,14,22,.68)';
    ctx.fill();
    ctx.strokeStyle = g.event.tint;
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.fillStyle = g.event.tint;
    ctx.textAlign = 'center';
    ctx.fillText(evLabel, W / 2, 78);
    ctx.textAlign = 'left';
  }


  if (g.charging) {
    const bx = 28, by = 200, bw = 12, bh = 150;
    roundRect(bx, by, bw, bh, 6);
    ctx.fillStyle = 'rgba(3,14,22,.55)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.stroke();
    const h = bh * g.charge;
    const grad = ctx.createLinearGradient(0, by + bh, 0, by);
    grad.addColorStop(0, '#5fd08a');
    grad.addColorStop(0.6, '#f0c987');
    grad.addColorStop(1, '#e0674b');
    roundRect(bx + 2, by + bh - h + 2, bw - 4, Math.max(2, h - 4), 4);
    ctx.fillStyle = grad; ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.font = '600 11px "Segoe UI",system-ui,sans-serif';
    ctx.fillText('сила', bx - 2, by - 8);
  }

  if (g.mode === 'hooked' && g.fish) {
    const f = g.fish;
    const bw = 470, bx = W / 2 - bw / 2;
    const pX = bx - 26, pY = H - 152, pW = bw + 52, pH = 128;

    roundRect(pX, pY, pW, pH, 16);
    ctx.fillStyle = 'rgba(4,14,22,.68)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(240,201,135,.25)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.textAlign = 'left';
    ctx.font = '700 15px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle = RARITY[f.r].col;
    ctx.fillText(f.name, bx, pY + 26);
    const nameW = ctx.measureText(f.name).width;
    ctx.font = '600 13px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle = 'rgba(210,232,244,.65)';
    ctx.fillText('· ' + f.kg.toFixed(2) + ' кг', bx + nameW + 8, pY + 26);

    if (g.dashFlash > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, g.dashFlash);
      ctx.textAlign = 'right';
      ctx.font = '700 13px "Segoe UI",system-ui,sans-serif';
      ctx.fillStyle = '#ff9b8a';
      ctx.fillText('РЫВОК!', bx + bw, pY + 26);
      ctx.restore();
    }

    ctx.textAlign = 'left';
    ctx.font = '600 10px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle = 'rgba(210,232,244,.6)';
    ctx.fillText('САЧОК', bx, pY + 46);
    if (g.ice > 0.35) {
      ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(190,230,255,.85)';
      ctx.font = '700 10px "Segoe UI",system-ui,sans-serif';
      ctx.fillText('ЛЁД', bx + bw, pY + 46);
      ctx.textAlign = 'left';
      ctx.font = '600 10px "Segoe UI",system-ui,sans-serif';
      ctx.fillStyle = 'rgba(210,232,244,.6)';
    }

    const ty = pY + 54, th = 18;
    roundRect(bx, ty, bw, th, 9);
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,.07)';
    for (let i = 1; i < 10; i++) {
      ctx.fillRect(bx + bw * i / 10, ty + 2, 1, th - 4);
    }

    if (g.ice > 0.05) {
      ctx.save();
      ctx.globalAlpha = g.ice * 0.5;
      const fr = ctx.createLinearGradient(bx, ty, bx, ty + th);
      fr.addColorStop(0, 'rgba(210,240,255,.9)');
      fr.addColorStop(0.55, 'rgba(210,240,255,.16)');
      fr.addColorStop(1, 'rgba(210,240,255,0)');
      ctx.fillStyle = fr;
      roundRect(bx, ty, bw, th, 9);
      ctx.fill();
      ctx.strokeStyle = 'rgba(225,245,255,.8)';
      ctx.lineWidth = 1.1;
      for (const sx of [bx + 10, bx + bw - 10]) {
        for (let k = 0; k < 3; k++) {
          const a = k * Math.PI / 3;
          ctx.beginPath();
          ctx.moveTo(sx - Math.cos(a) * 5, ty + th / 2 - Math.sin(a) * 5);
          ctx.lineTo(sx + Math.cos(a) * 5, ty + th / 2 + Math.sin(a) * 5);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    const zw = bw * (g.bandHalf * 2) / 100;
    const zx = bx + bw * (g.band / 100) - zw / 2;
    roundRect(zx, ty - 3, zw, th + 6, 10);
    const zg = ctx.createLinearGradient(zx, 0, zx + zw, 0);
    zg.addColorStop(0, 'rgba(60,175,110,.55)');
    zg.addColorStop(0.5, 'rgba(95,208,138,.95)');
    zg.addColorStop(1, 'rgba(60,175,110,.55)');
    ctx.fillStyle = zg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(180,255,205,.6)';
    ctx.lineWidth = 1.3;
    ctx.stroke();

    const inside = Math.abs(g.fishPos - g.band) <= g.bandHalf;
    const fishX = bx + bw * (g.fishPos / 100);
    const fishY = ty + th / 2;

    ctx.save();
    ctx.translate(fishX, fishY);
    const dir = g.fishVel < 0 ? -1 : 1;
    ctx.scale(dir, 1);
    ctx.fillStyle = inside ? '#ffe9b0' : '#dbe7ef';
    ctx.beginPath();
    ctx.ellipse(0, 0, 9, 4.6, 0, 0, PI2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-7, 0);
    ctx.lineTo(-13, -5);
    ctx.lineTo(-11, 0);
    ctx.lineTo(-13, 5);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#1c2228';
    ctx.beginPath();
    ctx.arc(5, -1.3, 1.3, 0, PI2);
    ctx.fill();
    ctx.restore();

    ctx.font = '600 10px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle = 'rgba(210,232,244,.6)';
    ctx.textAlign = 'left';
    ctx.fillText('СИЛЫ РЫБЫ', bx, pY + 88);
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(210,232,244,.75)';
    ctx.fillText(Math.round(g.stamina) + '%', bx + bw, pY + 88);

    const sy = pY + 96, sh = 12;
    roundRect(bx, sy, bw, sh, 6);
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    ctx.fill();
    const sw = bw * g.stamina / 100;
    const sg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    sg.addColorStop(0, '#5ecdf7');
    sg.addColorStop(1, '#2f8fd8');
    roundRect(bx, sy, Math.max(2, sw), sh, 6);
    ctx.fillStyle = sg;
    ctx.fill();

    let fightHint = 'Накрой рыбу зоной';
    let fightCol = 'rgba(235,246,252,.85)';
    if (!inside && g.fishPos > g.band) { fightHint = 'ПОДТЯНИ'; fightCol = '#8fd8ff'; }
    else if (!inside && g.fishPos < g.band) { fightHint = 'ОПУСТИ'; fightCol = '#ffc07a'; }
    if (inside) { fightHint = 'ДЕРЖИ'; fightCol = '#8ff0b0'; }
    if (g.slackT > 1.2) { fightHint = 'РЫБА УХОДИТ — ДОГОНЯЙ!'; fightCol = '#ff8b7a'; }
    if (g.staminaDropped && g.stamina > 85) { fightHint = 'РЫБА НАБИРАЕТ СИЛЫ!'; fightCol = '#ff8b7a'; }

    ctx.textAlign = 'center';
    ctx.font = '700 13px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle = fightCol;
    ctx.fillText(fightHint, W / 2, pY + 122);
  }

  ctx.textAlign = 'center';
  ctx.font = '600 14px "Segoe UI",system-ui,sans-serif';
  let hint = '';
  if (g.mode === 'idle') hint = g.charging ? 'Отпусти — и поплавок улетит' : 'Зажми мышь или пробел для заброса';
  else if (g.mode === 'waiting') hint = 'Ждём поклёвки…';
  else if (g.mode === 'bite') hint = 'КЛЮЁТ! Жми!';
  else if (g.mode === 'cast') hint = '';

  if (hint && g.mode !== 'hooked') {
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = 'rgba(3,14,22,.5)';
    const wdt = ctx.measureText(hint).width + 34;
    roundRect(W / 2 - wdt / 2, H - 52, wdt, 34, 17);
    ctx.fill();
    ctx.fillStyle = g.mode === 'bite' ? '#ffb3a8' : 'rgba(235,246,252,.92)';
    ctx.fillText(hint, W / 2, H - 30);
    ctx.restore();
  }

  if (g.msgT > 0) {
    const a = clamp(g.msgT, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = '600 17px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle = 'rgba(3,14,22,.6)';
    const wdt = ctx.measureText(g.msg).width + 40;
    roundRect(W / 2 - wdt / 2, 84, wdt, 40, 12);
    ctx.fill();
    ctx.fillStyle = '#e9f4fb';
    ctx.fillText(g.msg, W / 2, 110);
    ctx.globalAlpha = 1;
  }
}

let vignette = null;
function drawVignette(){
  if (!vignette) {
    vignette = ctx.createRadialGradient(W / 2, H * 0.45, H * 0.35, W / 2, H * 0.5, H * 0.95);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,.42)');
  }
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);
}

function draw(){
  ctx.fillStyle = '#04090e';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (g.shake > 0) {
    const s = g.shake;
    ctx.translate(rnd(-s, s), rnd(-s, s));
  }
  if (g.scene === 'shop') {
    drawShopScene();
  } else if (g.scene === 'store') {
    drawStoreScene();
  } else {
    drawSky();
    drawFarShore();
    drawWater();
    drawShadows();
    const camX = g.loc === 'boat' ? 150 : 0;
    const camY = g.loc === 'boat' ? 26 : 0;
    ctx.save();
    ctx.translate(camX, camY);
    if (g.loc === 'boat') {
      const ry = 352 + Math.sin(g.time * 1.05) * 3.2 + 48;
      ctx.save();
      ctx.beginPath(); ctx.rect(-220, ry, W + 440, H - ry); ctx.clip();
      ctx.globalAlpha = 0.24;
      ctx.translate(0, ry * 2);
      ctx.scale(1, -1);
      drawBoat();
      drawFisherman();
      ctx.restore();

      ctx.save();
      ctx.beginPath(); ctx.rect(-220, ry, W + 440, H - ry); ctx.clip();
      ctx.fillStyle = (g.pal || todPalette(g.tod)).wt;
      for (let i = 0; i < 12; i++) {
        const yy = ry + 4 + i * 8;
        ctx.globalAlpha = 0.48;
        ctx.fillRect(-220, yy + Math.sin(g.time * 1.5 + i) * 2.6, W + 440, 2.4);
      }
      ctx.restore();
      drawBoat();
    } else {
      drawBeach();
      if (g.loc === 'reeds') { drawLilies(); drawReeds(); }
      drawBeachDetails();
      drawBucket();
      drawChair();
      drawProps();
    }
    drawFisherman();
    drawLineAndBobber();
    drawFx();
    drawFireflies();
    drawDragonflies();
    ctx.restore();
    drawNightOverlay();
    drawWeather();
  }
  ctx.restore();
  if (g.scene === 'lake') drawShopHotspot();
  if (g.hurtFlash > 0.002) {
    ctx.save();
    ctx.fillStyle = 'rgba(190,32,32,' + (0.32 * g.hurtFlash).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  drawHUD();
  drawVignette();
  if (g.bestFlash > 0) {
    ctx.save();
    ctx.fillStyle = 'rgba(255, 215, 0,' + (g.bestFlash * 0.28).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  if (g.fade > 0.001) {
    ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, g.fade).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

window.__quietCove = g;

let last = performance.now();
function loop(t){
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  if (!bestiaryOpen() && !locOpen() && !skillOpen() && !catOpen()) update(dt);
  else g.time += dt * 0.2;
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

msg('Тихая заводь. Зажми мышь и отпусти — заброс.', 4);
})();
</script>
</body>
