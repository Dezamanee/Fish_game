<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Тихая заводь — 2D рыбалка</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d2b3d'/%3E%3Cpath d='M15 34 L4 23 Q7 34 4 45 Z' fill='%23f0c987'/%3E%3Cellipse cx='35' cy='34' rx='21' ry='11' fill='%23f0c987'/%3E%3Ccircle cx='45' cy='31' r='2.6' fill='%23121b22'/%3E%3C/svg%3E">
<style>
  :root{ --gold:#f0c987; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#04090e;overflow:hidden;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none}
  #stage{position:fixed;inset:0;display:grid;place-items:center;
    background:radial-gradient(ellipse at 50% 35%,#0d2131,#04090e 70%)}
  #frame{position:relative;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));
    border-radius:12px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.7)}
  canvas{display:block;width:100%;height:100%}
  #ui{position:absolute;inset:0;pointer-events:none}
  #ui button{pointer-events:auto;cursor:pointer;font-family:inherit}
  .topbar{position:absolute;top:2.2%;right:2%;display:flex;gap:8px}
  #btnLeave{display:none}
  body.scene-shop #btnLeave{display:inline-block}
  body.scene-shop #btnShop{display:none}
  body.scene-store #btnLeave{display:inline-block}
  body.scene-store #btnShop{display:none}
  .btn{border:1px solid rgba(240,201,135,.35);
    background:linear-gradient(180deg,rgba(20,40,55,.85),rgba(9,20,30,.92));
    color:#f2e2c4;padding:8px 16px;border-radius:10px;font-size:15px;letter-spacing:.02em;
    transition:.15s;backdrop-filter:blur(6px)}
  .btn:hover{border-color:var(--gold);color:#fff;transform:translateY(-1px)}
  .btn.icon{width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:12px}
  .btn.icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .btn.icon:hover{background:linear-gradient(180deg,rgba(52,74,92,.95),rgba(16,30,44,.98));
    box-shadow:0 0 0 1px rgba(240,201,135,.35),0 6px 16px rgba(0,0,0,.35)}
  .btn.icon:active{transform:translateY(1px) scale(.96)}
  #catchCard{position:absolute;inset:0;display:none;place-items:center;pointer-events:none}
  #catchCard.show{display:grid}
  .catchBox{display:flex;align-items:center;gap:18px;width:min(430px,88%);
    background:rgba(6,20,30,.95);border:1px solid rgba(240,201,135,.45);border-radius:18px;
    padding:18px 22px;box-shadow:0 24px 70px rgba(0,0,0,.65);pointer-events:auto;
    animation:catchIn .22s ease-out}
  @keyframes catchIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .catchArt{width:150px;height:96px;flex:none;display:grid;place-items:center;
    background:rgba(255,255,255,.04);border-radius:14px}
  .catchArt svg{width:130px;height:70px}
  .catchInfo{flex:1;min-width:0}
  .catchRarity{font-size:11px;letter-spacing:.12em;font-weight:600}
  .catchName{font-size:24px;font-weight:700;color:#f4fbff;margin-top:2px}
  .catchWeight{font-size:15px;color:rgba(220,238,248,.8);margin-top:2px}
  .catchPrice{font-size:21px;font-weight:700;color:var(--gold);margin-top:6px}
  .catchBest{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--gold);margin-top:8px}
  .catchHint{font-size:12px;color:rgba(180,205,220,.55);margin-top:8px}
  #bestiary{position:fixed;inset:0;display:none;place-items:center;padding:2.5%;
    background:radial-gradient(ellipse at 50% 40%,rgba(26,17,10,.94),rgba(4,3,2,.97) 72%);
    backdrop-filter:blur(4px);pointer-events:auto;z-index:6}
  #bestiary.open{display:grid}
  #locPanel{position:fixed;inset:0;display:none;place-items:center;padding:4%;
    background:radial-gradient(ellipse at 50% 40%,rgba(18,26,34,.9),rgba(3,6,10,.96) 72%);
    backdrop-filter:blur(4px);pointer-events:auto;z-index:6}
  #locPanel.open{display:grid}
  .locWrap{position:relative;width:min(760px,100%)}
  .locHead{text-align:center;color:#e3c78d;
    font:600 12px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.42em;text-transform:uppercase;
    margin-bottom:16px;text-shadow:0 2px 8px rgba(0,0,0,.85)}
  .locList{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .locCard{position:relative;text-align:left;cursor:pointer;border:1px solid rgba(240,201,135,.22);
    border-radius:14px;padding:16px 16px 18px;color:#e8f1f7;
    background:linear-gradient(180deg,rgba(24,42,56,.92),rgba(9,18,26,.96));
    transition:.16s;box-shadow:0 14px 30px rgba(0,0,0,.45)}
  .locCard:hover{border-color:rgba(240,201,135,.75);transform:translateY(-2px)}
  .locCard.active{border-color:#f0c987;box-shadow:0 0 0 1px rgba(240,201,135,.5),0 14px 30px rgba(0,0,0,.5)}
  .locName{font:700 19px "Segoe UI",system-ui,sans-serif;color:#ffe9b0}
  .locTag{font:600 11px "Segoe UI",system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;
    color:rgba(240,201,135,.6);margin-top:3px}
  .locDesc{font-size:12.5px;line-height:1.45;color:rgba(214,232,244,.72);margin-top:10px}
  .locFish{font-size:11.5px;color:rgba(214,232,244,.5);margin-top:10px}
  .locBuy{margin-top:12px;font:700 12px "Segoe UI",system-ui,sans-serif;
    letter-spacing:.06em;text-transform:uppercase;color:#9fe3a8}
  .locBuy.go{color:#f0c987}
  .locBuy.wait{color:rgba(214,232,244,.45)}
  .locBuy.buy{display:inline-block;color:#241708;background:linear-gradient(180deg,#f3d193,#d9a95c);
    border-radius:8px;padding:6px 12px;box-shadow:0 3px 0 rgba(96,62,26,.6)}
  .locCard.locked{opacity:.86}
  .locCard.locked:hover{border-color:rgba(240,201,135,.5)}
  @media (max-width:720px){ .locList{grid-template-columns:1fr} }
  #skillPanel{position:fixed;inset:0;display:none;place-items:center;padding:3%;
    background:radial-gradient(ellipse at 50% 38%,rgba(14,22,30,.92),rgba(3,6,10,.97) 72%);
    backdrop-filter:blur(4px);pointer-events:auto;z-index:6}
  #skillPanel.open{display:grid}
  .skillWrap{position:relative;width:min(900px,100%)}
  .skillHead{text-align:center;color:#e3c78d;
    font:600 12px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.42em;text-transform:uppercase;
    margin-bottom:10px;text-shadow:0 2px 8px rgba(0,0,0,.85)}
  .skillMeta{display:flex;gap:22px;justify-content:center;margin-bottom:16px;
    font:600 13px "Segoe UI",system-ui,sans-serif;color:#e8f1f7}
  .skillMeta b{color:#ffd98a}
  .skillGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .skillCol{display:flex;flex-direction:column;gap:22px}
  .skillColHead{text-align:center;letter-spacing:.2em;text-transform:uppercase;
    font:700 11px "Segoe UI",system-ui,sans-serif;color:rgba(240,201,135,.72)}
  .skillNode{position:relative;border:1px solid rgba(240,201,135,.22);border-radius:12px;
    padding:12px 14px;cursor:pointer;color:#e8f1f7;
    background:linear-gradient(180deg,rgba(22,36,48,.94),rgba(9,16,24,.96));
    transition:.15s;box-shadow:0 10px 22px rgba(0,0,0,.35)}
  .skillNode:hover{border-color:rgba(240,201,135,.75)}
  .skillNode + .skillNode::before{content:"";position:absolute;top:-22px;left:50%;width:2px;height:22px;
    transform:translateX(-50%);background:rgba(240,201,135,.28)}
  .skillNode.taken{border-color:rgba(240,201,135,.6);box-shadow:inset 0 0 0 1px rgba(240,201,135,.22)}
  .skillNode.maxed{background:linear-gradient(180deg,rgba(44,64,40,.95),rgba(13,24,15,.97))}
  .skillNode.locked{opacity:.48;cursor:default}
  .skillNode.locked:hover{border-color:rgba(240,201,135,.22)}
  .skTop{display:flex;justify-content:space-between;gap:8px;
    font:700 15px "Segoe UI",system-ui,sans-serif;color:#ffe9b0}
  .skRank{font-size:13px;color:#f0c987}
  .skDesc{font-size:12px;line-height:1.4;color:rgba(214,232,244,.72);margin-top:6px}
  .skLock{font-size:11px;margin-top:8px;color:rgba(240,201,135,.65);
    letter-spacing:.08em;text-transform:uppercase}
  .skillFoot{display:flex;justify-content:space-between;align-items:center;gap:12px;
    margin-top:18px;flex-wrap:wrap}
  .skillHint{font-size:12px;color:rgba(214,232,244,.55)}
  @media (max-width:720px){ .skillGrid{grid-template-columns:1fr} }
  #catPanel{position:fixed;inset:0;display:none;place-items:center;padding:3%;
    background:radial-gradient(ellipse at 50% 38%,rgba(16,22,28,.93),rgba(3,6,10,.97) 72%);
    backdrop-filter:blur(4px);pointer-events:auto;z-index:6}
  #catPanel.open{display:grid}
  .catWrap{position:relative;width:min(980px,100%)}
  .catHead{text-align:center;color:#e3c78d;font:600 12px/1 "Segoe UI",system-ui,sans-serif;
    letter-spacing:.42em;text-transform:uppercase;margin-bottom:12px}
  .catTabs{display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:14px}
  .catTab{border:1px solid rgba(240,201,135,.28);background:rgba(10,20,28,.7);color:#dce9f2;
    padding:7px 14px;border-radius:9px;font:600 13px "Segoe UI",system-ui,sans-serif;cursor:pointer}
  .catTab.on{background:linear-gradient(180deg,#3b2a17,#241708);border-color:#f0c987;color:#ffe9b0}
  .catMoney{margin-left:auto;padding-right:44px;color:#ffd98a;font:700 15px "Segoe UI",system-ui,sans-serif}
  @keyframes panelIn{from{opacity:0;transform:scale(.965)}to{opacity:1;transform:none}}
  #bestiary.open .bestiaryWrap,#locPanel.open .locWrap,#skillPanel.open .skillWrap,#catPanel.open .catWrap{animation:panelIn .2s ease-out}
  @keyframes cardPop{0%{transform:scale(1)}45%{transform:scale(1.07)}100%{transform:scale(1)}}
  .catCard.bought{animation:cardPop .38s ease-out;border-color:#f0c987}
  @keyframes catchIn{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:none}}
  #catchCard.show .catchBox{animation:catchIn .24s ease-out}
  @keyframes nodePop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
  .skillNode.bought{animation:nodePop .32s ease-out}
  .catGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;max-height:64vh;overflow:auto;padding-right:4px}
  .catCard{position:relative;border:1px solid rgba(240,201,135,.2);border-radius:12px;padding:11px 12px;
    background:linear-gradient(180deg,rgba(20,32,42,.94),rgba(9,15,22,.96));cursor:pointer;transition:.15s;
    display:flex;flex-direction:column;gap:6px}
  .catCard:hover{border-color:rgba(240,201,135,.7);transform:translateY(-2px)}
  .catCard.on{border-color:#f0c987;box-shadow:inset 0 0 0 1px rgba(240,201,135,.3)}
  .catCard.locked{opacity:.55}
  .catName{font:700 14px "Segoe UI",system-ui,sans-serif;color:#ffe9b0;line-height:1.2}
  .catDesc{font-size:11.5px;line-height:1.35;color:rgba(214,232,244,.65);flex:1}
  .catAct{margin-top:4px;font:700 11px "Segoe UI",system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase}
  .catAct.buy{color:#241708;background:linear-gradient(180deg,#f3d193,#d9a95c);border-radius:7px;padding:5px 8px;text-align:center}
  .catAct.use{color:#f0c987}
  .catAct.take{color:#9fe3a8}
  .catAct.lock{color:rgba(214,232,244,.45)}
  @media (max-width:900px){ .catGrid{grid-template-columns:repeat(3,1fr)} }
  .bestiaryWrap{position:relative;width:min(940px,calc(100vw - 120px));
    filter:drop-shadow(0 30px 60px rgba(0,0,0,.7))}
  .bestiaryHead{text-align:center;color:#e3c78d;
    font:600 12px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.42em;text-transform:uppercase;
    margin-bottom:12px;text-shadow:0 2px 8px rgba(0,0,0,.85)}
  .book{position:relative;display:grid;grid-template-columns:1fr 1fr;height:min(580px,80vh);
    background:linear-gradient(180deg,#3b2718,#231509);border:2px solid #6d4a28;border-radius:14px;
    padding:14px;box-shadow:inset 0 0 46px rgba(0,0,0,.75),0 0 0 1px rgba(240,201,135,.16);
    animation:bookIn .26s ease-out}
  @keyframes bookIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .book::before{content:"";position:absolute;left:50%;top:12px;bottom:12px;width:18px;
    transform:translateX(-50%);border-radius:3px;z-index:3;pointer-events:none;
    background:linear-gradient(90deg,rgba(80,52,26,.45),rgba(16,9,4,.9),rgba(80,52,26,.45))}
  .page{position:relative;padding:20px 28px 32px;overflow:hidden;
    background:radial-gradient(125% 95% at 50% -12%,#fbf4e4,#f0e1c6 55%,#e1cdaa);
    box-shadow:inset 0 0 34px rgba(122,92,54,.26),inset 0 0 4px rgba(90,64,34,.3)}
  .page:first-child{border-radius:6px 2px 2px 8px}
  .page:last-child{border-radius:2px 6px 8px 2px}
  .page::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 50% 50%,transparent 56%,rgba(96,68,34,.16) 100%)}
  .page::before{content:"";position:absolute;top:10px;bottom:10px;width:9px;
    background:repeating-linear-gradient(90deg,rgba(140,110,70,.22) 0 1px,transparent 1px 4px)}
  .page:first-child::before{left:4px}
  .page:last-child::before{right:4px}
  .fArt{height:168px;display:grid;place-items:center;margin:2px 0 4px}
  .fArt svg{width:min(240px,84%);max-height:150px;height:auto;filter:drop-shadow(0 3px 3px rgba(74,50,24,.22))}
  .fArt.locked svg{filter:grayscale(1) brightness(.62) contrast(.9);opacity:.5}
  .fName{text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:27px;
    letter-spacing:.09em;color:#3a2718;line-height:1.1;text-transform:uppercase}
  .fRar{width:max-content;margin:9px auto 0;padding:3px 18px;border-radius:3px;
    font:600 11px/1.2 "Segoe UI",system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;
    border:1px solid currentColor;background:rgba(255,255,255,.4)}
  .fDesc{font-family:Georgia,serif;font-style:italic;font-size:13px;line-height:1.45;color:#5f4a30;
    text-align:center;margin:16px 4px 14px;min-height:38px}
  .fStats{font:13px/1.5 "Segoe UI",system-ui,sans-serif;color:#4a3826}
  .fStats .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;
    border-bottom:1px solid rgba(90,66,36,.18)}
  .fStats .row span{color:#6d573c}
  .fStats .row b{font-weight:600;color:#332414}
  .folio{position:absolute;bottom:10px;left:0;right:0;text-align:center;
    font:11px Georgia,serif;color:#8a6f4c;letter-spacing:.12em}
  .navBtn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;
    border:1px solid rgba(240,201,135,.35);background:linear-gradient(180deg,#2a1c10,#17100a);
    color:#e9cfa0;font-size:24px;line-height:1;cursor:pointer;display:grid;place-items:center;
    transition:.15s;z-index:4}
  .navBtn:hover:not(:disabled){border-color:#f0c987;color:#fff;background:#33210f}
  .navBtn:disabled{opacity:.22;cursor:default}
  .navBtn.prev{left:-50px}
  .navBtn.next{right:-50px}
  .closeBtn{position:absolute;top:-14px;right:-14px;width:38px;height:38px;border-radius:50%;
    border:1px solid rgba(240,201,135,.4);background:#231509;color:#f0c987;font-size:20px;
    cursor:pointer;z-index:4;display:grid;place-items:center;transition:.15s}
  .closeBtn:hover{background:#33210f;color:#fff}
  .pager{text-align:center;margin-top:10px;font:600 12px "Segoe UI",system-ui,sans-serif;
    letter-spacing:.18em;color:#9c8259}
  @media (max-width:860px){
    .fName{font-size:20px}
    .fArt{height:120px}
    .fArt svg{max-height:104px}
    .page{padding:14px 16px 26px}
    .fStats{font-size:12px}
    .fDesc{font-size:12px;margin:10px 2px 8px}
  }
  @media (max-width:520px){
    .catchArt{width:96px;height:70px}
    .catchArt svg{width:86px;height:52px}
    .catchName{font-size:20px}
  }
</style>
</head>

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 960, H = 540, HORIZON = 250;

function fit(){
  const rect = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const cssW = rect.width > 10 ? rect.width : 960;
  const bw = Math.min(4096, Math.max(960, Math.round(cssW * dpr)));
  const bh = Math.round(bw * H / W);
  cv.width = bw;
  cv.height = bh;
  ctx.setTransform(bw / W, 0, 0, bh / H, 0, 0);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.imageSmoothingEnabled = true;
  if ('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality = 'high';
}
fit();
window.addEventListener('resize', fit);
document.addEventListener('fullscreenchange', fit);
document.addEventListener('webkitfullscreenchange', fit);
if (window.ResizeObserver) {
  try { new ResizeObserver(() => fit()).observe(cv); } catch (e) {}
}

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const money = n => n.toLocaleString('ru-RU');
const PI2 = Math.PI * 2;

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

const KEY = 'quiet_cove_save_v1';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { saved = {}; }
const P = {
  money: saved.money || 0,

  hp: typeof saved.hp === 'number' ? saved.hp : 100,
  skills: (saved.skills && typeof saved.skills === 'object') ? saved.skills : {},
  owned: (saved.owned && saved.owned.furn) ? saved.owned : { furn: ["f0"], cloth: ["c0"], boat: ["b0"] },
  equip: (saved.equip && saved.equip.furn) ? saved.equip : { furn: 'f0', cloth: 'c0', boat: 'b0' },

function locById(id){ return LOCS.find(l => l.id === id) || LOCS[0]; }
function isUnlocked(id){ return P.unlocked.indexOf(id) >= 0; }
function persist(){
  try {
    localStorage.setItem(KEY, JSON.stringify({
      money: P.money, caught: P.caught, best: P.best, species: P.species,
      muted: P.muted, up: P.up, rod: P.rod, rods: P.rods, loc: P.loc, tod: P.tod,
      lvl: P.lvl, xp: P.xp, sp: P.sp, hp: P.hp, skills: P.skills, unlocked: P.unlocked,
      owned: P.owned, equip: P.equip
    }));
  } catch (e) {}
}

function sk(id){ return P.skills[id] || 0; }
function hpMax(){ return 100 + 10 * (P.lvl - 1) + 20 * sk('vigor'); }
function regenRate(){ return 0.7 + 0.8 * sk('breath'); }
function hpDmgMul(){ return 1 - 0.15 * sk('line'); }
function hookWindow(){ return 0.92 + 0.12 * sk('hook'); }
function netBonus(){ return 1.6 * sk('net'); }
function patienceMul(){ return 1 - 0.12 * sk('patience'); }
function luckMul(){ return 1 + 0.12 * sk('sense'); }
function tradeMul(){ return 1 + 0.08 * sk('trade'); }
function nightBonus(){ return 0.15 * sk('night'); }
function xpNeed(lvl){ return Math.round(60 + 50 * Math.pow(lvl, 1.2)); }

function gainXP(n){
  P.xp += n;
  let ups = 0;
  while (P.xp >= xpNeed(P.lvl)) {
    P.xp -= xpNeed(P.lvl);
    P.lvl += 1;
    P.sp += 1;
    ups++;
  }
  if (ups > 0) {
    P.hp = hpMax();
    g.bestFlash = 1;
    sfx.buy();
    msg('Уровень ' + P.lvl + '! Очков навыков: ' + P.sp, 3.2);
    floatText(W / 2, 150, 'УРОВЕНЬ ' + P.lvl, '#ffe9b0');
  }
  persist();
}

function hurtPlayer(n){
  P.hp = Math.max(0, P.hp - n);
  g.hurtFlash = Math.min(1, 0.5 + n / hpMax());
  persist();
}
function healPlayer(dt, mult){
  if (P.hp <= 0 && g.mode === 'hooked') return;
  P.hp = Math.min(hpMax(), P.hp + regenRate() * dt * (mult || 1));
}

let actx = null, noiseBuf = null;
function ac(){
  if (!actx) {
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return null;
    actx = new A();
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type, vol, slideTo, delay){
  if (P.muted) return;
  const a = ac(); if (!a) return;
  const t0 = a.currentTime + (delay || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol || 0.15, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
function noiseHit(dur, vol, freq, q){
  if (P.muted) return;
  const a = ac(); if (!a) return;
  if (!noiseBuf) {
    noiseBuf = a.createBuffer(1, Math.floor(a.sampleRate * 0.5), a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const src = a.createBufferSource(); src.buffer = noiseBuf;
  const flt = a.createBiquadFilter(); flt.type = 'bandpass';
  flt.frequency.value = freq || 1200; flt.Q.value = q || 1;
  const gn = a.createGain();
  const t0 = a.currentTime;
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.linearRampToValueAtTime(vol || 0.15, t0 + 0.01);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(flt).connect(gn).connect(a.destination);
  src.start(t0); src.stop(t0 + dur + 0.05);
}

let rainSrc = null, rainGain = null;
function ambStart(){
  if (P.muted || windSrc) return;
  const a = ac(); if (!a) return;
  if (!noiseBuf) {
    noiseBuf = a.createBuffer(1, Math.floor(a.sampleRate * 2), a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < d.length; i++) {
      last = (last + (Math.random() * 2 - 1) * 0.35) * 0.86;
      d[i] = last * 2.4;
    }
  }
  const src = a.createBufferSource();
  src.buffer = noiseBuf;
  src.loop = true;
  const flt = a.createBiquadFilter();
  flt.type = 'lowpass'; flt.frequency.value = 460; flt.Q.value = 0.7;
  const gn = a.createGain();
  gn.gain.value = 0.0001;
  src.connect(flt).connect(gn).connect(a.destination);
  src.start();
  windSrc = src; windFilter = flt; windGain = gn;

  const rsrc = a.createBufferSource();
  rsrc.buffer = noiseBuf;
  rsrc.loop = true;
  const rflt = a.createBiquadFilter(); rflt.type = 'highpass'; rflt.frequency.value = 2400;
  const rgn = a.createGain();
  rgn.gain.value = 0.0001;
  rsrc.connect(rflt).connect(rgn).connect(a.destination);
  rsrc.start();
  rainSrc = rsrc; rainGain = rgn;
}

  let t = SHOP_GREETINGS[Math.floor(Math.random() * SHOP_GREETINGS.length)];
  let guard = 0;
  while (t === g.speech.lastGreeting && guard++ < 8) {
    t = SHOP_GREETINGS[Math.floor(Math.random() * SHOP_GREETINGS.length)];
  }
  g.speech.lastGreeting = t;
  return t;
}

function speakMumble(text){
  if (P.muted) return;
  const a = ac();
  if (!a) return;

  const letters = text.replace(/[^а-яёa-z ]/gi, '').replace(/\s+/g, '').length;
  const syllables = Math.max(4, Math.min(26, Math.round(letters / 2.6)));
  const base = 92 + Math.random() * 18;
  let t = a.currentTime + 0.03;

  for (let i = 0; i < syllables; i++) {
    const dur = 0.07 + Math.random() * 0.055;
    const osc = a.createOscillator();
    const filt = a.createBiquadFilter();
    const gain = a.createGain();

    filt.type = 'bandpass';
    filt.Q.value = 4 + Math.random() * 3;
    filt.frequency.value = [520, 680, 780, 900, 1100][Math.floor(Math.random() * 5)];

    const f0 = base + (Math.random() * 26 - 10);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(f0, t);
    osc.frequency.linearRampToValueAtTime(f0 * (0.9 + Math.random() * 0.2), t + dur);

    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(0.11, t + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    osc.connect(filt).connect(gain).connect(a.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);

    t += dur + 0.012 + (Math.random() < 0.16 ? 0.07 + Math.random() * 0.06 : 0);
  }

  if (Math.random() < 0.5) {
    const sigh = a.createOscillator();
    const sg = a.createGain();
    sigh.type = 'sine';
    sigh.frequency.setValueAtTime(150, t);
    sigh.frequency.linearRampToValueAtTime(90, t + 0.25);
    sg.gain.setValueAtTime(0.0001, t);
    sg.gain.linearRampToValueAtTime(0.05, t + 0.03);
    sg.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
    sigh.connect(sg).connect(a.destination);
    sigh.start(t);
    sigh.stop(t + 0.28);
  }
}

function splash(x, y, n, power){

    const a = rnd(-Math.PI * 0.95, -Math.PI * 0.05);
    const sp = rnd(30, 130) * (power || 1);
    const l = rnd(0.35, 0.8);
    g.parts.push({
      x: x + rnd(-5, 5), y: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30,
      life: l, max: l, size: rnd(1.5, 3.6)
    });
  }
  for (let i = 0; i < 2; i++) {

function pickFish(power){
  const bait = P.up.bait;
  const dist = 0.45 + 1.35 * power;
  const loc = LOCS.find(l => l.id === g.loc) || LOCS[0];
  const nf = nightFactor(g.tod);
  const df = 1 - nf;
  const locBoost = loc.id === 'boat' ? 1.3 : loc.id === 'reeds' ? 1.15 : 1;
  const mult = {
    common: 1,
    uncommon: dist * (1 + 0.22 * bait) * locBoost,
    rare: Math.pow(dist, 1.55) * (1 + 0.38 * bait) * (1 + (locBoost - 1) * 1.6),
    epic: Math.pow(dist, 2.2) * (1 + 0.60 * bait) * (1 + (locBoost - 1) * 2.2),
    legendary: Math.pow(dist, 3.0) * (1 + 0.95 * bait) * (1 + (locBoost - 1) * 2.6)
  };
  const er = eventRarity();
  mult.uncommon *= Math.sqrt(er);
  mult.rare *= er; mult.epic *= er; mult.legendary *= er;
  let total = 0;
  const pool = FISH.filter(f => loc.fish.indexOf(f.name) >= 0).map(f => {
    let tm = 1;
    if (NOCTURNAL.indexOf(f.name) >= 0) tm = 0.3 + (2.2 + nightBonus() * 4) * nf;
    else if (DIURNAL.indexOf(f.name) >= 0) tm = 0.4 + 1.3 * df;
    const w = Math.max(0.08, f.w * mult[f.r] * tm);
    total += w;
    return { f, w };
  });
  let r = Math.random() * total;
  let pick = pool[0].f;
  for (const p of pool) { r -= p.w; if (r <= 0) { pick = p.f; break; } }
  const lo = pick.kg[0], hi = pick.kg[1];
  const frac = Math.pow(Math.random(), 2.45);
  const kg = lo + (hi - lo) * frac;
  const cmRng = pick.cm || [10, 50];
  const cm = Math.max(1, Math.round(cmRng[0] + (cmRng[1] - cmRng[0]) * Math.pow(frac, 1 / 3)));
  return {
    name: pick.name, r: pick.r, col: pick.col, diff: pick.diff, svg: pick.svg,
    kg: Math.round(kg * 100) / 100,
    cm: cm,
    xp: Math.round(8 + kg * 6 + RARITY_XP[pick.r]),
    value: Math.max(1, Math.round(kg * pick.price * tradeMul())),
    pull: true, timer: rnd(0.5, 1.1)
  };
}

function loseFish(text){
  const fdiff = g.fish ? g.fish.diff : 0.6;
  const dmg = Math.round(hpMax() * (0.06 + 0.06 * fdiff) * hpDmgMul());
  hurtPlayer(dmg);

  g.mode = 'idle';
  g.bob.visible = false;
  g.recall = null;
  if (wasBob) {
    g.bob.visible = true;
    g.recall = { x0: bx0, y0: by0, t: 0, dur: 0.55, spin: rnd(-6, 6) };
  }
  g.reeling = false;
  g.fish = null;
  g.tension = 0;
  g.tensionVel = 0;
  g.stamina = 100;
  g.slackT = 0;
  g.staminaDropped = false;
  g.progress = 0;

  splash(g.bob.x, g.bob.y, 14, 1.1);

}
function breakLine(){

}
function landFish(){
  const f = g.fish;
  P.money += f.value;
  P.caught += 1;
  gainXP(f.xp || 10);
  P.hp = Math.min(hpMax(), P.hp + 4);
  const prev = P.species[f.name];
  const isSpeciesRecord = !prev || f.kg > prev.kg;
  const isGlobalRecord = !P.best || f.kg > P.best.kg;
  if (isGlobalRecord) P.best = { name: f.name, kg: f.kg, r: f.r };
  P.species[f.name] = {
    kg: prev ? Math.max(prev.kg, f.kg) : f.kg,
    r: f.r,
    svg: f.svg,
    cm: (prev && f.kg <= prev.kg && prev.cm) ? prev.cm : f.cm,
    count: (prev && prev.count ? prev.count : 0) + 1
  };
  const isRecord = isSpeciesRecord || isGlobalRecord;
  g.bestFlash = isRecord ? 1 : 0;
  persist();
  g.mode = 'landed';
  g.popup = { fish: f, t: 0, best: isRecord };
  g.reeling = false;
  g.bob.visible = false;
  g.shake = 5;
  splash(g.bob.x, g.bob.y, 22, 1.3);
  floatText(g.bob.x, g.bob.y - 70, '+' + money(f.value) + ' ₽', '#ffe9b0');
  sfx.land();
  showCatchCard(f, isRecord);
}

function press(){
  if (g.scene !== 'lake') return;
  if (bestiaryOpen() || skillOpen() || catOpen()) return;
  if (g.mode === 'idle') {
    if (P.hp < 12) { msg('Сил не осталось — отдохните в лавке', 2.4); return; }
    if (g.recall) { g.recall = null; g.bob.visible = false; }
    g.charging = true;
    g.charge = 0;
    sfx.tick();
  } else if (g.mode === 'waiting') {
    if (g.time < g.cancelGuard) return;
    g.mode = 'idle';
    g.bob.visible = false;
    splash(g.bob.x, g.bob.y, 8, 0.6);
    sfx.splash(0.5);
    msg('Снасть смотана', 1.2);
  } else if (g.mode === 'bite') {
    hookFish();
  } else if (g.mode === 'hooked') {
    g.reeling = true;
  } else if (g.mode === 'landed') {
    closePopup();
  }
}
function release(){
  if (g.mode === 'idle' && g.charging) cast();
  if (g.mode === 'hooked') g.reeling = false;
}

function canvasPoint(e){
  const r = cv.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) / r.width * W,
    y: (e.clientY - r.top) / r.height * H
  };
}
window.addEventListener('pointermove', e => {
  const p = canvasPoint(e);
  g.mouse.x = p.x;
  g.mouse.y = p.y;
  if (g.scene === 'shop' && g.held) {
    const it = g.held;
    const now = performance.now();
    const dtm = Math.max(12, now - g.lastMoveTime) / 1000;
    g.lastMoveTime = now;
    const nvx = (p.x - (it.ax === undefined ? p.x : it.ax)) / dtm;
    const nvy = (p.y - (it.ay === undefined ? p.y : it.ay)) / dtm;
    it.pvx = lerp(it.pvx || 0, nvx, 0.45);
    it.pvy = lerp(it.pvy || 0, nvy, 0.45);
    it.ax = p.x;
    it.ay = p.y;
  }
  const hoverProp = propAt(p.x, p.y);
  g.propHover = hoverProp ? hoverProp.id : null;
});
window.addEventListener('pointerdown', e => {
  if (e.button !== undefined && e.button !== 0) return;
  if (e.target && e.target.closest && e.target.closest('button')) return;
  if (locOpen() || skillOpen() || catOpen()) return;
  ambStart();
  const p = canvasPoint(e);
  g.mouse.x = p.x;
  g.mouse.y = p.y;

  if (g.scene === 'store') {
    const tb = storeHit(p.x, p.y);
    if (tb) { catTab = tb; openCat(); }
    return;
  }
  if (g.scene === 'shop') {
    if (g.popup) { closePopup(); return; }
    const it = shopItemAt(p.x, p.y);
    if (it && !g.held) {
      g.held = it;
      it.held = true;
      it.vx = 0;
      it.vy = 0;
      g.grabDX = it.x - p.x;
      g.grabDY = it.y - p.y;
      const grabDist = Math.hypot(it.x - p.x, it.y - p.y);
      it.pendL = it.kind === 'rod' ? Math.max(58, grabDist) : Math.max(34, grabDist);
      it.th = Math.atan2(it.y - p.y, it.x - p.x);
      it.om = 0;
      it.ax = p.x; it.ay = p.y;
      g.lastMoveTime = performance.now();
      g.hoverItem = null;
      sfx.tick();
      e.preventDefault();
    }
    return;
  }
  const hitProp = propAt(p.x, p.y);
  if (hitProp) { sfx.tick(); hitProp.act(); e.preventDefault(); return; }
  if (g.shopHover > 0.5 && p.x < 120) { goShop(); return; }
  if (g.mode === 'landed' && g.popup) { closePopup(); return; }
  press();
  e.preventDefault();
}, { passive: false });
window.addEventListener('pointerup', e => {
  if (e.button !== undefined && e.button !== 0) return;
  if (g.scene === 'shop' && g.held) {
    const it = g.held;
    it.held = false;
    g.held = null;
    if (inRegister(it)) tryBuy(it);
    else { it.vy = 0; it.vx *= 0.6; }
    return;
  }
  release();
});
window.addEventListener('pointercancel', () => {
  if (g.mode === 'hooked') g.reeling = false;
  g.charging = false;
});
window.addEventListener('contextmenu', e => e.preventDefault());

let spaceDown = false;
window.addEventListener('keydown', e => {
  if (locOpen() || skillOpen() || catOpen()) {
    if (e.code === 'Escape') { e.preventDefault(); closeLoc(); closeSkills(); closeCat(); }
    return;
  }
  if (bestiaryOpen()) {
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'Escape' || e.code === 'Space') {
      e.preventDefault();
    }
    if (e.code === 'ArrowLeft' && spread > 0) { spread--; renderBestiary(); sfx.tick(); return; }
    if (e.code === 'ArrowRight' && spread < Math.ceil(FISH.length / 2) - 1) { spread++; renderBestiary(); sfx.tick(); return; }
    if (e.code === 'Escape') { closeBestiary(); return; }
    return;
  }
  if (e.code === 'Space') {
    e.preventDefault();
    if (spaceDown) return;
    spaceDown = true;
    if (g.popup) { closePopup(); return; }
    press();
  }
  if (e.code === 'Escape') {
    if (g.scene === 'shop' || g.scene === 'store') { goLake(); return; }
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') { spaceDown = false; release(); }
});
window.addEventListener('blur', () => {
  if (g.held) { g.held.held = false; g.held = null; }
  spaceDown = false;
  g.charging = false;
  if (g.mode === 'hooked') g.reeling = false;
});

function buySkill(id){

  P.skills[id] = sk(id) + 1;

  persist();
  renderSkills();
}

  for (const s of SKILLS) refund += sk(s.id);
  if (refund === 0) { msg('Пока нечего сбрасывать', 1.6); return; }
  P.money -= 50;
  P.skills = {};
  P.sp += refund;
  P.hp = Math.min(hpMax(), P.hp);
  sfx.tick();
  persist();
  renderSkills();
  msg('Навыки сброшены, ' + refund + ' очков вернулись', 2.2);

function ambientAudio(dt){
  if (P.muted) { if (windGain) ambWind(0.0001); return; }
  if (g.scene !== 'lake') { if (windGain) ambWind(0.0001); return; }
  ambStart();
  const a = g.amb;
  const nf = nightFactor(g.tod);
  const df = 1 - nf;

  a.windT -= dt;
  if (a.windT <= 0) {
    a.windT = 0.5;
    const gust = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(g.time * 0.13 + Math.sin(g.time * 0.37) * 1.8));
    const base = g.loc === 'boat' ? 0.034 : 0.022;
    ambWind(base * gust);
  }

  a.bird -= dt; a.cricket -= dt; a.frog -= dt; a.lap -= dt;
  a.rare -= dt; a.splash -= dt; a.creak -= dt;

  if (a.bird <= 0) {
    a.bird = rnd(4, 10) * (1 + nf * 2.5);
    if (nf < 0.45) amb.bird();
  }
  if (a.cricket <= 0) {
    a.cricket = rnd(1.1, 3.2) * (1 + df * 2.2);
    if (nf > 0.45) amb.cricket();
  }
  if (a.frog <= 0) {
    a.frog = rnd(5, 13);
    if (nf > 0.35 && (g.loc === 'reeds' || g.loc === 'beach')) amb.frog();
  }
  if (a.lap <= 0) { a.lap = rnd(2.2, 5.5); amb.lap(); }
  if (a.splash <= 0) {
    a.splash = rnd(6, 15);
    amb.splash();
    g.ripples.push({ x: rnd(320, 900), y: rnd(330, 500), r: 2, max: rnd(16, 30), life: 0.9 });
  }
  if (a.creak <= 0) { a.creak = rnd(7, 16); if (g.loc === 'boat') amb.creak(); }
  if (a.rare <= 0) {
    a.rare = rnd(22, 48);
    if (nf > 0.55) amb.owl();
    else if (g.loc === 'boat' || Math.random() < 0.55) amb.gull();
  }
}

function updateAmbient(dt){
  ambientAudio(dt);
  for (const c of g.clouds) {
    c.x -= c.v * dt;
    if (c.x < -220) { c.x = W + 220; c.y = rnd(40, 150); c.s = rnd(0.6, 1.5); }
  }
  for (const b of g.birds) {
    b.x += b.v * dt;
    if (b.x > W + 60) { b.x = -60; b.y = rnd(70, 160); }
  }
  for (const s of g.shadows) {
    s.x += s.v * dt;
    if (s.x < 340) { s.x = 340; s.v = Math.abs(s.v); }
    if (s.x > 950) { s.x = 950; s.v = -Math.abs(s.v); }
  }
}

function eventWait(){
  const id = g.event && g.event.id;
  if (id === 'rain') return 0.82;
  if (id === 'storm') return 1.25;
  if (id === 'fog') return 1.15;
  return 1;
}
function eventRarity(){
  const id = g.event && g.event.id;
  if (id === 'stars') return 1.4;
  if (id === 'eclipse') return 1.3;
  return 1;
}
function startEvent(){
  const nf = nightFactor(g.tod);
  const pool = EVENTS.filter(e => {
    if (e.id === 'stars') return nf > 0.55;
    if (e.id === 'eclipse') return nf < 0.15;
    return true;
  });
  const e = pool[Math.floor(Math.random() * pool.length)] || EVENTS[2];
  g.event = { id: e.id, name: e.name, t: e.dur, dur: e.dur, tint: e.tint };
  g.flash = 0;
  g.lightningT = rnd(0.6, 2);
  g.meteors = [];
  msg('Событие: ' + e.name, 2.6);
  if (e.id === 'storm') sfx.thunder();
}
function updateEvents(dt){
  if (g.scene !== 'lake') { rainLevel(0.0001); return; }
  if (!g.event) {
    g.nextEvent -= dt;
    if (g.nextEvent <= 0) startEvent();
    return;
  }
  g.event.t -= dt;
  const id = g.event.id;
  if (id === 'storm') {
    g.flash = Math.max(0, g.flash - dt * 2.6);
    g.lightningT -= dt;
    if (g.lightningT <= 0) {
      g.flash = 1;
      g.lightningT = rnd(2.2, 5.5);
      sfx.thunder();
    }
    g.waveMul = 1 + 1.1 * Math.abs(Math.sin(g.time * 0.45));
    rainLevel(0.05);
  } else if (id === 'rain') {
    g.waveMul = 1.25;
    rainLevel(0.035);
  } else {
    g.waveMul = 1;
    rainLevel(0.0001);
  }

  if (id === 'stars') {
    if (g.meteors.length < 3 && Math.random() < dt * 1.6) {
      g.meteors.push({
        x: rnd(60, W), y: rnd(10, 120), vx: rnd(-260, -120), vy: rnd(90, 160),
        life: 1, len: rnd(40, 90)
      });
      tone(rnd(1400, 2200), 0.35, 'sine', 0.018, 600);
    }
    for (const m of g.meteors) {
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      m.life -= dt * 0.9;
    }
    g.meteors = g.meteors.filter(m => m.life > 0);
  } else if (g.meteors.length) {
    g.meteors = [];
  }

  if (g.event.t <= 0) {
    msg('Небо снова спокойно', 2.2);
    g.event = null;
    g.nextEvent = rnd(45, 100);
    g.waveMul = 1;
    rainLevel(0.0001);
  }
}

function update(dt){
  g.time += dt;
  g.tod = (g.tod + dt * 24 / DAY_SECONDS) % 24;
  P.tod = g.tod;
  g.pal = todPalette(g.tod);
  updateAmbient(dt);

  const kHp = 1 - Math.exp(-9 * dt);
  const kXp = 1 - Math.exp(-7 * dt);
  g.hpView += (clamp(P.hp / hpMax(), 0, 1) - g.hpView) * kHp;
  g.xpView += (clamp(P.xp / xpNeed(P.lvl), 0, 1) - g.xpView) * kXp;
  if (g.hurtFlash > 0) g.hurtFlash = Math.max(0, g.hurtFlash - dt * 1.9);
  if (g.regFlash > 0) g.regFlash = Math.max(0, g.regFlash - dt * 2.4);
  for (const p of PROPS) {
    const on = g.propHover === p.id && propsActive() ? 1 : 0;
    g.propAnim[p.id] = lerp(g.propAnim[p.id] || 0, on, 1 - Math.exp(-14 * dt));
  }

  if (g.pendingScene) {
    g.fade = Math.min(1, g.fade + dt * 3.2);
    if (g.fade >= 0.995) {
      g.scene = g.pendingScene;
      g.pendingScene = null;
      syncSceneUI();
      if (g.scene === 'shop') {
        g.mode = 'idle';
        g.charging = false;
        g.speech.text = nextGreeting();
        g.speech.show = 4.5;
        g.speech.timer = 10;
        speakMumble(g.speech.text);
        buildShopGoods();
      }
    }
  } else {
    g.fade = Math.max(0, g.fade - dt * 2.4);
  updateEvents(dt);
  }

  const hoverT = (g.scene === 'lake' && g.mouse.x >= 0 && g.mouse.x < 120) ? 1 : 0;
  g.shopHover += (hoverT - g.shopHover) * (1 - Math.exp(-12 * dt));

  if (g.scene === 'shop') {
    if (g.speech.show > 0) g.speech.show -= dt;
    g.speech.timer -= dt;
    if (g.speech.timer <= 0) {
      g.speech.text = nextShopPhrase();
      g.speech.show = 4.5;
      g.speech.timer = 10;
      speakMumble(g.speech.text);
    }
    updateShopItems(dt);
    g.hoverItem = g.held ? null : shopItemAt(g.mouse.x, g.mouse.y);
    return;
  }
  if (g.scene === 'store') {
    healPlayer(dt, 4);
    return;
  }


  if (g.mode === 'idle' || g.mode === 'landed' || g.mode === 'waiting') healPlayer(dt, 1);
  if (g.shake > 0) g.shake = Math.max(0, g.shake - dt * 26);
  if (g.msgT > 0) g.msgT -= dt;
  if (g.bestFlash > 0) g.bestFlash = Math.max(0, g.bestFlash - dt * 0.6);

  for (let i = g.ripples.length - 1; i >= 0; i--) {
    const r = g.ripples[i];
    r.r += dt * (r.max * 1.6);
    r.life -= dt * 1.1;
    if (r.life <= 0) g.ripples.splice(i, 1);
  }
  for (let i = g.parts.length - 1; i >= 0; i--) {
    const p = g.parts[i];
    p.vy += 420 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) g.parts.splice(i, 1);
  }
  for (let i = g.floats.length - 1; i >= 0; i--) {
    const f = g.floats[i];
    f.y -= 22 * dt;
    f.life -= dt;
    if (f.life <= 0) g.floats.splice(i, 1);
  }

  const BASE_ANGLE = -0.61;
  const hipX = 200, hipY = 300;
  const swinging = g.mode === 'cast' && g.castPhase === 'swing';

  let leanT = 0;
  if (g.charging) leanT = -0.13 * (0.35 + 0.65 * g.charge);
  if (swinging) leanT = 0.15;
  g.lean += (leanT - g.lean) * (1 - Math.exp(-16 * dt));

  let angT = BASE_ANGLE;
  if (g.charging) angT = BASE_ANGLE - 1.62 * g.charge;
  else if (g.mode === 'waiting' || g.mode === 'bite') angT = BASE_ANGLE + 0.07;
  else if (g.mode === 'hooked') angT = BASE_ANGLE + 0.09 + Math.sin(g.time * 9) * 0.03;

  if (swinging) {
    const p = clamp(g.swingT / 0.16, 0, 1);
    g.rodAngle = lerp(g.swingFrom, 0.1, 1 - Math.pow(1 - p, 3));
    g.rodVel = 0;
  } else {
    g.rodVel += (angT - g.rodAngle) * 520 * dt;
    g.rodVel *= Math.exp(-14 * dt);
    g.rodAngle += g.rodVel * dt;
  }

  const breath = Math.sin(g.time * 1.6) * 1.6;
  const bx = 228, by = 268 + breath;
  const cl = Math.cos(g.lean), sl = Math.sin(g.lean);
  const hdx = bx - hipX, hdy = by - hipY;
  g.hand.x = hipX + hdx * cl - hdy * sl;
  g.hand.y = hipY + hdx * sl + hdy * cl;
  g.rodTip.x = g.hand.x + Math.cos(g.rodAngle) * 154;
  g.rodTip.y = g.hand.y + Math.sin(g.rodAngle) * 154;
  if (g.recall) {
    const r = g.recall;
    r.t += dt;
    const p = clamp(r.t / r.dur, 0, 1);
    const e = 1 - Math.pow(1 - p, 2.1);
    const tipX = g.rodTip.x, tipY = g.rodTip.y;
    g.bob.x = lerp(r.x0, tipX, e) + Math.sin(p * Math.PI * 3.2) * 12 * (1 - p);
    g.bob.y = lerp(r.y0, tipY, e) - Math.sin(p * Math.PI) * 52 + Math.sin(p * Math.PI * 5) * 5 * (1 - p);
    if (p >= 1) {
      g.recall = null;
      g.bob.visible = false;
    }
  }


  if (g.mode === 'idle') {
    if (g.charging) g.charge = Math.min(1, g.charge + dt * 0.8);
  } else if (g.mode === 'cast') {
    if (g.castPhase === 'swing') {
      g.swingT += dt;
      if (g.swingT >= 0.16) {
        g.castPhase = 'fly';
        g.castT = 0;
        g.castFrom.x = g.rodTip.x;
        g.castFrom.y = g.rodTip.y;
        g.bob.x = g.castFrom.x;
        g.bob.y = g.castFrom.y;
        g.bob.visible = true;
        g.rodVel = -7;
        sfx.cast();
      }
    } else {
      g.castT += dt / 0.5;
      const p = Math.min(1, g.castT);
      g.bob.x = lerp(g.castFrom.x, g.bob.tx, p);
      g.bob.y = lerp(g.castFrom.y, g.bob.ty, p) - Math.sin(p * Math.PI) * 110 * (0.4 + g.power * 0.6);
      if (p >= 1) land();
    }
  } else if (g.mode === 'waiting') {
    g.waitT -= dt;
    g.nibbleT -= dt;
    if (g.nibbleT <= 0) {
      g.nibbleT = rnd(0.9, 2.6);
      g.ripples.push({ x: g.bob.x + rnd(-4, 4), y: g.bob.y, r: 2, max: rnd(12, 22), life: 0.8 });
    }
    if (g.waitT <= 0) startBite();
  } else if (g.mode === 'bite') {
    g.biteT -= dt;
    if (g.biteT <= 0) missBite();
  } else if (g.mode === 'hooked') {
    const f = g.fish;
    const lineMod = 1 - 0.12 * P.up.line;
    const rodMod = (RODS.find(r => r.id === P.rod) || RODS[0]).drain;

    const ice = clamp((f.diff - 0.55) / 1.35, 0, 1);
    g.ice = ice;
    g.bandHalf = clamp(22 - 8 * (f.diff - 0.55), 11, 22) + netBonus();

    g.dashT -= dt;
    if (g.dashT <= 0) {
      g.dashT = rnd(0.9, 1.9);
      g.fishTarget = rnd(8, 92);
      g.fishVel += (g.fishTarget > g.fishPos ? 1 : -1) * rnd(35, 60) * (0.7 + 0.5 * f.diff);
      g.dashFlash = 1;
      splash(g.bob.x, g.bob.y, 7, 0.8);
    }
    if (g.dashFlash > 0) g.dashFlash = Math.max(0, g.dashFlash - dt * 1.8);

    g.fishVel += (g.fishTarget - g.fishPos) * 2.2 * dt;
    g.fishVel *= Math.exp(-2.2 * dt);
    g.fishPos += g.fishVel * dt;
    if (g.fishPos < 5) { g.fishPos = 5; if (g.fishVel < 0) g.fishVel *= -0.4; }
    if (g.fishPos > 95) { g.fishPos = 95; if (g.fishVel > 0) g.fishVel *= -0.4; }

    const accel = g.reeling ? 560 * lineMod : -(580 - 80 * ice);
    g.bandVel += accel * dt;
    g.bandVel += Math.sin(g.time * 2.4 + f.diff * 2) * 30 * ice * dt;
    g.bandVel *= Math.exp(-(7 - 2.2 * ice) * dt);
    g.band += g.bandVel * dt;

    const minB = g.bandHalf, maxB = 100 - g.bandHalf;
    if (g.band < minB) { g.band = minB; if (g.bandVel < 0) g.bandVel = 0; }
    if (g.band > maxB) { g.band = maxB; if (g.bandVel > 0) g.bandVel = 0; }

    const inside = Math.abs(g.fishPos - g.band) <= g.bandHalf;
    if (inside) g.stamina -= 18 * rodMod / (f.endur || 1) * dt;
    else g.stamina += 3.5 * dt;
    g.stamina = clamp(g.stamina, 0, 100);

    if (g.stamina < 70) g.staminaDropped = true;
    if (!inside) g.slackT += dt;
    else g.slackT = Math.max(0, g.slackT - dt * 1.6);

    f.pull = !inside && g.fishPos > g.band;

    g.bob.y = g.bob.ty + (f.pull ? 3 : -1) + Math.sin(g.time * 11) * 2;
    g.bob.x = g.bob.tx + Math.sin(g.time * 7) * (f.pull ? 4 : 1.5);

    if (inside && Math.random() < dt * 7) {
      g.parts.push({
        x: g.bob.x + rnd(-6, 6), y: g.bob.y,
        vx: rnd(-40, 40), vy: rnd(-90, -30),
        life: 0.5, max: 0.5, size: rnd(1, 2.6)
      });
    }
    if (g.stamina <= 0) landFish();
    else if (g.staminaDropped && g.stamina >= 99.5) loseFish('Рыба отдохнула и ушла из-под сачка.');
    else if (g.slackT >= 3) loseFish('Рыба ушла из-под сачка.');
  } else if (g.mode === 'landed') {
    if (g.popup) {
      g.popup.t += dt;
      if (g.popup.t > 5) closePopup();
    }
  }
}

function wrapLines(text, maxWidth, font){
  ctx.font = font;
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function layoutShopGoods(snap){
  let ri = 0, si = 0;
  for (const it of g.shopItems) {
    if (it.kind === 'rod') {
      it.restX = 98 + ri * 80;
      it.restY = 256;
      it.restRot = -Math.PI / 2 - 0.05 + ri * 0.03;
      ri++;
    } else {
      it.restX = 620 + si * 62;
      it.restY = 338;
      si++;
    }
    if (snap) {
      it.x = it.restX;
      it.y = it.restY;
      it.rot = it.restRot;
      it.vx = 0;
      it.vy = 0;
    }
  }
}

function shopItemAt(mx, my){
  for (let i = g.shopItems.length - 1; i >= 0; i--) {
    const it = g.shopItems[i];
    if (it.kind === 'rod') {
      const dx = mx - it.x, dy = my - it.y;
      const c = Math.cos(-it.rot), s = Math.sin(-it.rot);
      const lx = dx * c - dy * s, ly = dx * s + dy * c;
      if (Math.abs(lx) <= it.len / 2 && Math.abs(ly) <= 13) return it;
    } else if (Math.abs(mx - it.x) <= 20 && Math.abs(my - it.y) <= 26) {
      return it;
    }
  }
  return null;
}

function updateShopItems(dt){
  for (const it of g.shopItems) {
    if (it.held) {
      const ax = g.mouse.x, ay = g.mouse.y;
      const isRod = it.kind === 'rod';
      const L = it.pendL || (isRod ? 58 : 34);
      const damp = isRod ? 1.7 : 0.85;
      const grav = isRod ? 1500 : 1900;
      const kick = isRod ? 0.08 : 0.24;

      it.th += it.om * dt;
      it.om += (grav / L) * Math.cos(it.th) * dt;
      it.om *= Math.exp(-damp * dt);
      const pvx = it.pvx || 0, pvy = it.pvy || 0;
      const vt = -pvx * Math.sin(it.th) + pvy * Math.cos(it.th);
      it.om -= clamp(vt / L, -12, 12) * kick;
      it.om = clamp(it.om, -16, 16);

      it.x = clamp(ax + Math.cos(it.th) * L, 40, 920);
      it.y = clamp(ay + Math.sin(it.th) * L, 40, 470);
      it.rot = isRod ? it.th : clamp(it.th - Math.PI / 2, -1.45, 1.45);
      it.vx = -Math.sin(it.th) * it.om * L;
      it.vy = Math.cos(it.th) * it.om * L;
      it.pvx = (it.pvx || 0) * Math.exp(-4 * dt);
      it.pvy = (it.pvy || 0) * Math.exp(-4 * dt);
      continue;
    }
    it.vy += 1500 * dt;
    it.x += it.vx * dt;
    it.y += it.vy * dt;
    if (it.y >= it.restY) {
      it.y = it.restY;
      if (Math.abs(it.vy) > 70) it.vy = -it.vy * 0.28;
      else it.vy = 0;
      it.vx *= 0.72;
      if (Math.abs(it.vx) < 10) it.vx = 0;
      it.rot += (it.restRot - it.rot) * (1 - Math.exp(-9 * dt));
    }
    if (it.x < 70) { it.x = 70; it.vx = Math.abs(it.vx) * 0.4; }
    if (it.x > 900) { it.x = 900; it.vx = -Math.abs(it.vx) * 0.4; }
  }
}

function inRegister(it){
  return it.x > REGISTER.x - 12 && it.x < REGISTER.x + REGISTER.w + 12 &&
         it.y > REGISTER.y - 30 && it.y < REGISTER.y + REGISTER.h + 30;
}

function tryBuy(it){
  if (P.money < it.price) {
    const lack = it.price - P.money;
    msg('Не хватает ' + money(lack) + ' ₽', 1.8);
    const line = SHOP_BROKE[Math.floor(Math.random() * SHOP_BROKE.length)];
    keeperSay(line(lack));
    sfx.tick();
    return false;
  }
  P.money -= it.price;

  if (it.kind === 'rod') {
    P.rod = it.rodId;
    if (!P.rods.includes(it.rodId)) P.rods.push(it.rodId);
  } else if (it.kind === 'bait') {
    P.up.bait = Math.min(3, P.up.bait + 1);
  } else if (it.kind === 'line') {
    P.up.line = Math.min(4, P.up.line + 1);
  }

  persist();
  sfx.buy();
  msg('Куплено: ' + it.name, 1.8);
  keeperSay(SHOP_THANKS[Math.floor(Math.random() * SHOP_THANKS.length)]);
  floatText(REGISTER.x + 64, REGISTER.y - 8, '-' + money(it.price) + ' ₽', '#ffd9a0');
  g.regFlash = 1;

  const idx = g.shopItems.indexOf(it);
  if (idx >= 0) g.shopItems.splice(idx, 1);
  if (g.hoverItem === it) g.hoverItem = null;
  buildShopGoods();
  return true;
}

function hex2rgb(h){
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mixHex(a, b, t){
  const A = hex2rgb(a), B = hex2rgb(b);
  return 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * t) + ',' +
    Math.round(A[1] + (B[1] - A[1]) * t) + ',' +
    Math.round(A[2] + (B[2] - A[2]) * t) + ')';
}
const SKY_KEYS = [
  { h: 0,    top: '#07111f', mid: '#0d2038', low: '#16324a', hor: '#1b3550', wt: '#14304a', wd: '#030c16', amb: 0.62 },
  { h: 4,    top: '#0b1a2e', mid: '#1d2f4a', low: '#3c4a66', hor: '#6b5a70', wt: '#1a3550', wd: '#05101c', amb: 0.50 },
  { h: 5.5,  top: '#24405f', mid: '#6b6a8c', low: '#b98a86', hor: '#e0a07a', wt: '#2b4a66', wd: '#0a1c2c', amb: 0.22 },
  { h: 6.8,  top: '#2a5a86', mid: '#7ea6c4', low: '#e0b090', hor: '#ffcf9a', wt: '#3d6a86', wd: '#153b4f', amb: 0.06 },
  { h: 9,    top: '#1f5480', mid: '#66a1c6', low: '#aed3e2', hor: '#efd0a4', wt: '#5b93aa', wd: '#1b4658', amb: 0 },
  { h: 13,   top: '#1b4e7c', mid: '#5f9dc5', low: '#a9d0e0', hor: '#f0cfa0', wt: '#5f97ad', wd: '#1c475a', amb: 0 },
  { h: 17,   top: '#24507a', mid: '#7f9ec0', low: '#c8b7b0', hor: '#f2c790', wt: '#578ba2', wd: '#194253', amb: 0.04 },
  { h: 18.8, top: '#1c3350', mid: '#5c5a80', low: '#b0705e', hor: '#e08a5a', wt: '#2f4f6a', wd: '#081a27', amb: 0.28 },
  { h: 20.5, top: '#0c1a2c', mid: '#17293f', low: '#24384f', hor: '#3a4258', wt: '#1b374f', wd: '#04101a', amb: 0.50 },
  { h: 24,   top: '#07111f', mid: '#0d2038', low: '#16324a', hor: '#1b3550', wt: '#14304a', wd: '#030c16', amb: 0.62 }
];
function todPalette(tod){
  const h = ((tod % 24) + 24) % 24;
  let i = 0;
  while (i < SKY_KEYS.length - 2 && h > SKY_KEYS[i + 1].h) i++;
  const a = SKY_KEYS[i], b = SKY_KEYS[i + 1];
  const t = clamp((h - a.h) / (b.h - a.h), 0, 1);
  return {
    top: mixHex(a.top, b.top, t), mid: mixHex(a.mid, b.mid, t),
    low: mixHex(a.low, b.low, t), hor: mixHex(a.hor, b.hor, t),
    wt: mixHex(a.wt, b.wt, t), wd: mixHex(a.wd, b.wd, t),
    amb: a.amb + (b.amb - a.amb) * t
  };
}
function nightFactor(tod){
  const h = ((tod % 24) + 24) % 24;
  if (h >= 8 && h <= 17) return 0;
  if (h >= 22 || h <= 4) return 1;
  if (h > 17 && h < 22) return (h - 17) / 5;
  return 1 - (h - 4) / 4;
}
function clockText(tod){
  const h = ((tod % 24) + 24) % 24;
  const hh = Math.floor(h), mm = Math.floor((h - hh) * 60);
  return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
}
function todPhase(tod){
  const h = ((tod % 24) + 24) % 24;
  if (h < 5) return 'ночь';
  if (h < 7.5) return 'рассвет';
  if (h < 11) return 'утро';
  if (h < 16) return 'день';
  if (h < 18.5) return 'вечер';
  if (h < 21) return 'закат';
  return 'ночь';
}

function drawSky(){
  const pal = g.pal || (g.pal = todPalette(g.tod));
  const nf = nightFactor(g.tod);
  const sk = ctx.createLinearGradient(0, 0, 0, HORIZON + 12);
  const evId = g.event && g.event.id;
  let cTop = pal.top, cMid = pal.mid, cLow = pal.low, cHor = pal.hor;
  if (evId === 'rain' || evId === 'storm') {
    cTop = mixHex(cTop, '#46545e', 0.5); cMid = mixHex(cMid, '#5c6a74', 0.5);
    cLow = mixHex(cLow, '#6e7a82', 0.45); cHor = mixHex(cHor, '#7a848b', 0.4);
  }
  if (evId === 'eclipse') {
    cTop = mixHex(cTop, '#080f1c', 0.72); cMid = mixHex(cMid, '#0f1a2a', 0.72);
    cLow = mixHex(cLow, '#182432', 0.66); cHor = mixHex(cHor, '#2a2f3a', 0.6);
  }
  if (evId === 'fog') {
    cTop = mixHex(cTop, '#b7c2c7', 0.32); cMid = mixHex(cMid, '#c3cbcf', 0.44);
    cLow = mixHex(cLow, '#ced4d5', 0.5); cHor = mixHex(cHor, '#d8dad6', 0.5);
  }
  sk.addColorStop(0, pal.top);
  sk.addColorStop(0, cTop);
  sk.addColorStop(0.45, pal.mid);
  sk.addColorStop(0.45, cMid);
  sk.addColorStop(0.82, pal.low);
  sk.addColorStop(0.82, cLow);
  sk.addColorStop(1, pal.hor);
  sk.addColorStop(1, cHor);
  ctx.fillStyle = sk;
  ctx.fillRect(-20, -20, W + 40, HORIZON + 32);

  if (nf > 0.02) {
    for (const st of g.stars) {
      const tw = 0.55 + 0.45 * Math.sin(g.time * st.sp + st.ph);
      ctx.fillStyle = 'rgba(238,246,255,' + (nf * tw * 0.85).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, PI2); ctx.fill();
    }
  }

  const dayP = (g.tod - 6) / 12;
  const isDay = dayP >= 0 && dayP <= 1;
  let bx, by, bodyR;
  if (isDay) {
    bx = 90 + dayP * 780;
    by = HORIZON - 26 - Math.sin(dayP * Math.PI) * 172;
    bodyR = 30;
  } else {
    const np = isDay ? 0 : ((g.tod < 6 ? g.tod + 24 : g.tod) - 18) / 12;
    bx = 90 + np * 780;
    by = HORIZON - 30 - Math.sin(np * Math.PI) * 150;
    bodyR = 20;
  }

  const glow = ctx.createRadialGradient(bx, by, 6, bx, by, isDay ? 170 : 110);
  if (isDay) {
    glow.addColorStop(0, 'rgba(255,232,176,.85)');
    glow.addColorStop(0.35, 'rgba(255,199,126,.32)');
    glow.addColorStop(1, 'rgba(255,199,126,0)');
  } else {
    glow.addColorStop(0, 'rgba(210,228,255,.42)');
    glow.addColorStop(0.4, 'rgba(160,190,230,.14)');
    glow.addColorStop(1, 'rgba(160,190,230,0)');
  }
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(bx, by, isDay ? 170 : 110, 0, PI2); ctx.fill();

  ctx.fillStyle = isDay ? '#ffeec4' : '#e8f0ff';
  ctx.beginPath(); ctx.arc(bx, by, bodyR, 0, PI2); ctx.fill();
  if (!isDay) {
    ctx.fillStyle = mixHex('#0d2038', '#16324a', 0.4);
    ctx.beginPath(); ctx.arc(bx + 10, by - 5, bodyR * 0.86, 0, PI2); ctx.fill();
  }
  g.body = { x: bx, y: by, r: bodyR, day: isDay };
  if (evId === 'eclipse' && isDay) {
    ctx.fillStyle = '#0b1220';
    ctx.beginPath(); ctx.arc(bx + 5, by - 3, bodyR * 0.96, 0, PI2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,228,164,.5)';
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(bx, by, bodyR + 7, 0, PI2); ctx.stroke();
  }

  for (const c of g.clouds) {
    ctx.save();
    ctx.globalAlpha = c.a * (isDay ? 1 : 0.45);
    ctx.fillStyle = isDay ? mixHex('#eaf4fb', '#c9d6e4', nf) : '#54627a';
    ctx.translate(c.x, c.y);
    ctx.scale(c.s, c.s);
    ctx.beginPath();
    ctx.ellipse(0, 0, 60, 18, 0, 0, PI2); ctx.fill();
    ctx.beginPath();
    ctx.ellipse(-30, 4, 34, 14, 0, 0, PI2); ctx.fill();
    ctx.beginPath();
    ctx.ellipse(34, 6, 40, 15, 0, 0, PI2); ctx.fill();
    ctx.beginPath();
    ctx.ellipse(4, -12, 32, 18, 0, 0, PI2); ctx.fill();
    ctx.restore();
  }

  ctx.strokeStyle = 'rgba(30,60,80,' + (0.45 - 0.28 * nf).toFixed(3) + ')';
  ctx.lineWidth = 1.6;
  for (const b of g.birds) {
    if (!isDay) break;
    const flap = Math.sin(g.time * 3 + b.phase) * 4;
    ctx.beginPath();
    ctx.moveTo(b.x - 8, b.y + flap);
    ctx.quadraticCurveTo(b.x - 3, b.y - 2, b.x, b.y);
    ctx.quadraticCurveTo(b.x + 3, b.y - 2, b.x + 8, b.y + flap);
    ctx.stroke();
  }
}

function drawFarShore(){

  ctx.save();

  ctx.fillStyle = mixHex('#7f9fb2', '#20313f', nf * 0.85);

  }

  ctx.closePath(); ctx.fill();

  ctx.fillStyle = mixHex('#2c5a63', '#132430', nf * 0.9);
  ctx.beginPath();
  ctx.moveTo(0, HORIZON);
  for (let x = 0; x <= W; x += 10) {
    const y = HORIZON - 12 - Math.sin(x * 0.013 + 3.4) * 8 - Math.sin(x * 0.031 + 1) * 4;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, HORIZON);
  ctx.closePath(); ctx.fill();

  const sandFar = mixHex('#ddc79c', '#3c3a2c', nf * 0.82);
  ctx.fillStyle = sandFar;
  ctx.beginPath();
  ctx.moveTo(-4, HORIZON - 7);
  for (let x = -4; x <= W + 4; x += 12) {
    const y = HORIZON - 8 - Math.sin(x * 0.021 + 0.6) * 2.6 - Math.sin(x * 0.007) * 1.8;

  }
  ctx.lineTo(W + 4, HORIZON + 3);
  ctx.lineTo(-4, HORIZON + 3);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = mixHex('#b9a074', '#2c2a20', nf * 0.8);
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(-4, HORIZON + 2.5);
  ctx.lineTo(W + 4, HORIZON + 1.5);
  ctx.stroke();

  const rndAt = (i) => {
    const v = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return v - Math.floor(v);
  };
  const treeDark = mixHex('#2a5760', '#0f2029', nf * 0.92);
  const treeMid = mixHex('#356a72', '#132633', nf * 0.92);
  for (let i = 0; i < 56; i++) {
    const x = -12 + i * 17.5 + rndAt(i) * 9;
    const base = HORIZON - 6 - rndAt(i + 0.7) * 5;
    const h = 12 + rndAt(i + 1.3) * 25;
    ctx.fillStyle = i % 3 === 0 ? treeMid : treeDark;
    if (rndAt(i + 2.1) > 0.45) {
      for (let k = 0; k < 3; k++) {
        const w = 7 - k * 1.7, yy = base - h * (k * 0.27);
        ctx.beginPath();
        ctx.moveTo(x, yy - h * 0.44);
        ctx.lineTo(x + w, yy);
        ctx.lineTo(x - w, yy);
        ctx.closePath(); ctx.fill();
      }
    } else {
      ctx.beginPath();
      ctx.arc(x, base - h * 0.58, 5 + rndAt(i + 3.3) * 4.5, 0, PI2);
      ctx.fill();
      ctx.fillRect(x - 1, base - h * 0.52, 2, h * 0.52);

  }

  const houseCol = mixHex('#3a5a62', '#101d26', nf * 0.9);

  const houses = [[598, 0.9], [626, 1.12], [664, 0.82], [700, 1.0]];

    ctx.fillRect(hx - w / 2, hy - hh, w, hh);
    ctx.fillStyle = roofCol;
    ctx.beginPath();
    ctx.moveTo(hx - w / 2 - 3, hy - hh);
    ctx.lineTo(hx, hy - hh - 9 * s);
    ctx.lineTo(hx + w / 2 + 3, hy - hh);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = winCol;
    ctx.fillRect(hx - w * 0.24, hy - hh * 0.7, 4 * s, 4 * s);
    ctx.fillRect(hx + w * 0.06, hy - hh * 0.7, 4 * s, 4 * s);
  }

  const cx0 = 758;
  ctx.fillStyle = houseCol;
  ctx.fillRect(cx0 - 9, HORIZON - 33, 18, 26);
  ctx.fillStyle = roofCol;
  ctx.beginPath();
  ctx.moveTo(cx0 - 12, HORIZON - 33);
  ctx.lineTo(cx0, HORIZON - 60);
  ctx.lineTo(cx0 + 12, HORIZON - 33);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(cx0 - 1, HORIZON - 67, 2, 7);
  ctx.fillRect(cx0 - 4, HORIZON - 65, 8, 2);
  if (nf > 0.35) {
    ctx.fillStyle = winCol;
    ctx.fillRect(cx0 - 3, HORIZON - 27, 3, 5);
  }

  const pierCol = mixHex('#4a5f68', '#141f27', nf * 0.9);
  ctx.fillStyle = pierCol;
  ctx.fillRect(96, HORIZON - 6, 76, 3);
  for (let px = 100; px < 170; px += 12) ctx.fillRect(px, HORIZON - 6, 2, 6);
  ctx.beginPath();
  ctx.ellipse(178, HORIZON - 3, 11, 3.2, 0, 0, PI2);
  ctx.fill();

  ctx.save();
  const grassFar = mixHex('#6f8f4a', '#22301c', nf * 0.85);
  const bushFar = mixHex('#3f6a4a', '#132a1c', nf * 0.85);
  for (let i = 0; i < 42; i++) {
    const x = -6 + i * 23 + rndAt(i + 5.5) * 18;
    const gy = HORIZON - 6 - rndAt(i + 6.1) * 2;
    const h = 3 + rndAt(i + 7.3) * 4.5;
    ctx.strokeStyle = grassFar;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x, gy); ctx.lineTo(x - 1.5, gy - h);
    ctx.moveTo(x, gy); ctx.lineTo(x + 1.6, gy - h * 0.8);
    ctx.moveTo(x, gy); ctx.lineTo(x + 0.4, gy - h * 1.15);
    ctx.stroke();
  }
  for (let i = 0; i < 10; i++) {
    const x = 30 + i * 98 + rndAt(i + 9.1) * 34;
    ctx.fillStyle = bushFar;
    ctx.beginPath();
    ctx.ellipse(x, HORIZON - 8, 7 + rndAt(i + 4.4) * 5, 4 + rndAt(i + 2.2) * 2.5, 0, 0, PI2);

    ctx.fillStyle = 'rgba(255,255,255,.07)';
    ctx.beginPath();
    ctx.ellipse(x - 2, HORIZON - 10, 4, 1.8, 0, 0, PI2);

  }

  const reedFar = mixHex('#5b7a3c', '#1f2c1a', nf * 0.85);

  for (const rx of [84, 102, 458, 486, 808, 832]) {

      ctx.strokeStyle = reedFar;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x, HORIZON - 5);
      ctx.lineTo(x + 1.5, HORIZON - 5 - h);
      ctx.stroke();
      ctx.fillStyle = headsFar;
      ctx.beginPath();
      ctx.ellipse(x + 1.5, HORIZON - 5 - h - 2, 1.3, 2.8, 0, 0, PI2);
      ctx.fill();

  }

  ctx.globalAlpha = 0.34;
  const haze = ctx.createLinearGradient(0, HORIZON - 18, 0, HORIZON + 4);
  haze.addColorStop(0, 'rgba(255,255,255,0)');
  haze.addColorStop(1, pal.hor);
  ctx.fillStyle = haze;
  ctx.fillRect(0, HORIZON - 18, W, 24);

function drawWater(){
  const pal = g.pal || (g.pal = todPalette(g.tod));
  const nf = nightFactor(g.tod);
  const wt = ctx.createLinearGradient(0, HORIZON, 0, H);
  wt.addColorStop(0, pal.wt);
  wt.addColorStop(0.34, mixHex(pal.wt, pal.wd, 0.5));
  wt.addColorStop(1, pal.wd);
  ctx.fillStyle = wt;
  ctx.fillRect(-20, HORIZON, W + 40, H - HORIZON + 40);

  ctx.save();
  ctx.beginPath(); ctx.rect(0, HORIZON, W, H - HORIZON); ctx.clip();

  for (let i = 0; i < 26; i++) {
    const y = HORIZON + 10 + i * 11;
    const sp = 0.5 + i * 0.028;
    ctx.strokeStyle = 'rgba(178,224,240,' + (0.055 + 0.035 * (1 - i / 26)).toFixed(3) + ')';
    ctx.lineWidth = 1 + i * 0.035;
    ctx.beginPath();
    for (let x = -20; x <= W + 20; x += 14) {
      const yy = y + Math.sin(x * 0.018 + g.time * sp + i * 0.9) * (2.2 + i * 0.14) * (g.waveMul || 1);
      if (x <= -20) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }

  const body = g.body || { x: 742, day: true };
  const glit = body.day ? '255,214,150' : '196,220,255';
  const glitA = body.day ? 0.16 : 0.11;
  const colW = 130;
  const colGrad = ctx.createLinearGradient(body.x - colW, 0, body.x + colW, 0);
  colGrad.addColorStop(0, 'rgba(' + glit + ',0)');
  colGrad.addColorStop(0.5, 'rgba(' + glit + ',' + (glitA * 0.55).toFixed(3) + ')');
  colGrad.addColorStop(1, 'rgba(' + glit + ',0)');
  ctx.fillStyle = colGrad;
  ctx.fillRect(body.x - colW, HORIZON + 4, colW * 2, H - HORIZON - 4);

  for (let i = 0; i < 64; i++) {
    const p = i / 64;
    const y = HORIZON + 5 + p * (H - HORIZON - 8);
    const w = (12 + p * 120) * (0.86 + 0.14 * Math.sin(g.time * 1.4 + i * 0.5));
    const a = glitA * (1 - p * 0.7) * (0.65 + 0.35 * Math.sin(g.time * 2.1 + i * 0.9));
    ctx.fillStyle = 'rgba(' + glit + ',' + Math.max(0, a).toFixed(3) + ')';
    ctx.fillRect(body.x - w / 2 + Math.sin(g.time * 1.1 + i * 0.6) * 7, y, w, 1.7);
  }

  if (nf > 0.28) {
    const lights = [598, 626, 664, 700, 758];
    for (let i = 0; i < lights.length; i++) {
      const lx = lights[i] + Math.sin(g.time * 1.7 + i * 1.3) * 2.4;
      const h = 20 + Math.sin(g.time * 1.2 + i) * 7;
      const lg = ctx.createLinearGradient(0, HORIZON + 2, 0, HORIZON + 2 + h);
      lg.addColorStop(0, 'rgba(255,206,120,' + (0.30 * nf).toFixed(3) + ')');
      lg.addColorStop(1, 'rgba(255,206,120,0)');
      ctx.fillStyle = lg;
      ctx.fillRect(lx - 1.4, HORIZON + 2, 2.8, h);
    }
  }

  for (const r of g.ripples) {
    ctx.strokeStyle = 'rgba(215,240,250,' + (0.45 * r.life).toFixed(3) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(r.x, r.y, r.r, r.r * 0.34, 0, 0, PI2);
    ctx.stroke();
  }

  ctx.restore();
}

function drawShadows(){
  ctx.save();
  ctx.beginPath(); ctx.rect(0, HORIZON + 40, W, H - HORIZON - 40); ctx.clip();
  for (const s of g.shadows) {
    ctx.save();
    ctx.globalAlpha = 0.11 * (0.7 + 0.3 * Math.sin(g.time * 1.6 + s.phase));
    ctx.fillStyle = '#04131c';
    ctx.translate(s.x, s.y);
    ctx.scale(s.v < 0 ? -1 : 1, 1);
    ctx.rotate(Math.sin(g.time * 1.4 + s.phase) * 0.07);
    const L = s.len;
    ctx.beginPath(); ctx.ellipse(0, 0, L, L * 0.34, 0, 0, PI2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-L * 0.85, 0);
    ctx.lineTo(-L * 1.7, -L * 0.42);
    ctx.lineTo(-L * 1.55, 0);
    ctx.lineTo(-L * 1.7, L * 0.42);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

const SHORE = [
  [-30, 268], [50, 280], [120, 296], [190, 310], [260, 330],
  [330, 360], [395, 402], [445, 470], [475, 545]
];

function shorePath(){
  ctx.beginPath();
  ctx.moveTo(SHORE[0][0], SHORE[0][1]);
  for (let i = 1; i < SHORE.length - 1; i++) {
    const p = SHORE[i], n = SHORE[i + 1];
    ctx.quadraticCurveTo(p[0], p[1], (p[0] + n[0]) / 2, (p[1] + n[1]) / 2);
  }
  const a = SHORE[SHORE.length - 2], b = SHORE[SHORE.length - 1];
  ctx.quadraticCurveTo(a[0], a[1], b[0], b[1]);
}

function drawChair(){
  const f = eqItem('furn');
  const frame = f.frame || '#3b464e';
  const seat = f.seat || '#b06a55';
  const backX = 172, frontX = 232, seatY = 294;

  ctx.fillStyle = 'rgba(70,52,26,.25)';
  ctx.beginPath();
  ctx.ellipse(200, 358, 54, 9, 0, 0, PI2);
  ctx.fill();

  if (f.style === 'bag') {
    ctx.fillStyle = seat;
    ctx.beginPath(); ctx.ellipse(204, 320, 48, 40, -0.08, 0, PI2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    ctx.beginPath(); ctx.ellipse(190, 306, 20, 14, -0.3, 0, PI2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.14)';
    ctx.beginPath(); ctx.ellipse(214, 336, 26, 14, -0.1, 0, PI2); ctx.fill();
  } else if (f.style === 'lounger') {
    ctx.strokeStyle = frame;
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(150, 344); ctx.lineTo(252, 352);
    ctx.moveTo(252, 352); ctx.lineTo(260, 318);
    ctx.stroke();
    ctx.fillStyle = seat;
    roundRect(148, 318, 112, 19, 9); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    roundRect(150, 320, 108, 5, 2.5); ctx.fill();
  } else {
    ctx.strokeStyle = frame;
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.moveTo(backX + 10, seatY + 2);
    ctx.lineTo(frontX - 6, 356);
    ctx.moveTo(frontX - 6, seatY + 2);
    ctx.lineTo(backX + 4, 356);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(backX + 2, seatY);
    ctx.lineTo(backX - 8, 250);
    ctx.moveTo(backX + 14, seatY);
    ctx.lineTo(backX + 2, 252);
    ctx.stroke();

    if (f.style === 'throne') {
      ctx.fillStyle = frame;
      roundRect(backX - 14, 236, 30, 62, 8); ctx.fill();
      ctx.fillStyle = seat;
      roundRect(backX - 10, 242, 22, 50, 6); ctx.fill();
      ctx.fillStyle = 'rgba(255,235,170,.75)';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath(); ctx.arc(backX - 4 + i * 8, 246, 1.8, 0, PI2); ctx.fill();
      }
    }

    ctx.beginPath();
    ctx.moveTo(backX - 6, seatY - 2);
    ctx.lineTo(backX - 9, 254);
    ctx.lineTo(backX + 5, 256);
    ctx.lineTo(backX + 10, seatY - 2);
    ctx.closePath();
    ctx.fillStyle = seat;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(backX + 4, seatY - 1);
    ctx.lineTo(frontX - 4, seatY - 3);
    ctx.lineTo(frontX - 8, seatY + 9);
    ctx.lineTo(backX + 4, seatY + 8);
    ctx.closePath();
    ctx.fillStyle = seat;
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    if (f.style === 'wicker') {
      ctx.strokeStyle = 'rgba(90,64,32,.35)';
      ctx.lineWidth = 1.2;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(backX - 4 + i * 4, seatY - 1);
        ctx.lineTo(frontX - 10 + i * 3, seatY + 7);
        ctx.stroke();
      }
    }
  }

  if (f.canopy) drawCanopy(f.canopy);
}

function drawCanopy(kind){
  const sets = {
    cream: ['#f2e7cc', '#d6c6a2'],
    green: ['#74a05e', '#4c763f'],
    red:   ['#a2483e', '#772c26'],
    gold:  ['#f0d183', '#c39a33']
  };
  const c = sets[kind] || sets.cream;

  ctx.strokeStyle = '#6d5a3a';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(148, 356); ctx.lineTo(148, 214); ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(196 - 78, 214);
  ctx.arc(196, 214, 78, Math.PI, 0);
  ctx.closePath();
  const grd = ctx.createLinearGradient(0, 130, 0, 218);
  grd.addColorStop(0, c[0]);
  grd.addColorStop(1, c[1]);
  ctx.fillStyle = grd;
  ctx.fill();

function drawReeds(){
  const nf = nightFactor(g.tod);
  const stem = mixHex('#5b7a3c', '#1f2c1a', nf * 0.85);
  const stem2 = mixHex('#7a9a4e', '#2b3a22', nf * 0.85);
  const head = mixHex('#6b4a2a', '#241a10', nf * 0.85);
  const leaf = mixHex('#46602c', '#18240f', nf * 0.85);

  const clumps = [
    [52, 528, 1.05], [100, 546, 0.9], [148, 556, 0.76],
    [742, 520, 0.92], [800, 536, 0.8], [868, 552, 0.68], [930, 566, 0.56]
  ];
  for (const [bx, by, s] of clumps) {
    const sway = Math.sin(g.time * 1.15 + bx * 0.02) * 7;
    ctx.strokeStyle = leaf;
    ctx.lineWidth = 3 * s;
    for (let i = 0; i < 3; i++) {
      const lx = bx - 16 + i * 15;
      ctx.beginPath();
      ctx.moveTo(lx, by);
      ctx.quadraticCurveTo(lx - 14 * s, by - 38 * s, lx - 26 * s, by - 66 * s + sway);
      ctx.stroke();
    }
    for (let i = 0; i < 6; i++) {
      const off = (i - 2.5) * 12 * s;
      const h = (92 + (i % 3) * 32) * s;
      const x0 = bx + off;
      const x1 = x0 + sway * (0.35 + i * 0.09) + (i - 2.5) * 5;
      ctx.strokeStyle = i % 2 ? stem2 : stem;
      ctx.lineWidth = 3.1 * s;
      ctx.beginPath();
      ctx.moveTo(x0, by);
      ctx.quadraticCurveTo(x0 + (x1 - x0) * 0.45, by - h * 0.6, x1, by - h);
      ctx.stroke();
      if (i % 2 === 0) {
        ctx.fillStyle = head;
        ctx.beginPath();
        ctx.ellipse(x1, by - h - 7 * s, 4.2 * s, 10 * s, 0.06, 0, PI2);
        ctx.fill();
      }
    }
  }
}

function drawWeather(){
  const ev = g.event && g.event.id;
  if (ev === 'rain' || ev === 'storm') {
    const n = ev === 'storm' ? 150 : 90;
    ctx.strokeStyle = 'rgba(200,225,240,.34)';
    ctx.lineWidth = 1.1;
    for (let i = 0; i < n; i++) {
      const seed = i * 97.13;
      const x = ((seed * 13 + g.time * 520) % (W + 140)) - 70;
      const y = ((seed * 7 + g.time * 900) % (H + 90)) - 45;
      const len = 12 + (i % 5) * 4;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - 3, y + len);
      ctx.stroke();
    }
  }
  if (ev === 'storm' && g.flash > 0.02) {
    ctx.fillStyle = 'rgba(220,235,255,' + (g.flash * 0.30).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
    if (g.flash > 0.55) {
      ctx.strokeStyle = 'rgba(238,247,255,' + (0.8 * g.flash).toFixed(2) + ')';
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      let lx = 620, ly = 26;
      ctx.moveTo(lx, ly);
      for (let k = 0; k < 6; k++) {
        lx += rnd(-24, 24);
        ly += 27;
        ctx.lineTo(lx, ly);
      }
      ctx.stroke();
    }
  }
  if (ev === 'fog') {
    ctx.save();
    const veil = ctx.createLinearGradient(0, HORIZON - 150, 0, H + 40);
    veil.addColorStop(0, 'rgba(216,226,230,0)');
    veil.addColorStop(0.45, 'rgba(220,230,234,.14)');
    veil.addColorStop(1, 'rgba(226,235,238,.22)');
    ctx.fillStyle = veil;
    ctx.fillRect(-20, HORIZON - 150, W + 40, H - HORIZON + 190);
    for (let i = 0; i < 8; i++) {
      const speed = 5 + (i % 3) * 5;
      const cx = ((i * 211 + g.time * speed) % (W + 560)) - 280;
      const cy = HORIZON - 84 + ((i * 43) % 200) + Math.sin(g.time * 0.21 + i * 1.7) * 14;
      const r = 150 + ((i * 57) % 140);
      const a = 0.09 + ((i * 31) % 8) / 100;
      const gr = ctx.createRadialGradient(cx, cy, r * 0.12, cx, cy, r);
      gr.addColorStop(0, 'rgba(228,237,240,' + a.toFixed(3) + ')');
      gr.addColorStop(0.5, 'rgba(222,232,236,' + (a * 0.5).toFixed(3) + ')');
      gr.addColorStop(1, 'rgba(220,230,234,0)');
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.ellipse(cx, cy, r * 1.4, r * 0.66, 0, 0, PI2);
      ctx.fill();
    }
    ctx.restore();
  }
  if (g.meteors && g.meteors.length) {
    for (const m of g.meteors) {
      const a = clamp(m.life, 0, 1);
      const nx = m.x + m.len * 0.35, ny = m.y - m.len * 0.35;
      const gr = ctx.createLinearGradient(m.x, m.y, nx, ny);
      gr.addColorStop(0, 'rgba(255,245,200,' + (0.85 * a).toFixed(3) + ')');
      gr.addColorStop(1, 'rgba(255,235,180,0)');
      ctx.strokeStyle = gr;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(nx, ny); ctx.stroke();
      ctx.fillStyle = 'rgba(255,252,225,' + a.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(m.x, m.y, 2.2, 0, PI2); ctx.fill();
    }
  }
}
